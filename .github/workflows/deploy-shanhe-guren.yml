name: Deploy Shanhe Guren to GitHub Pages

on:
  push:
    branches:
      - prototype/shanhe-guren-v0.2
    paths:
      - "shanhe-guren/**"
      - ".github/workflows/deploy-shanhe-guren.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shanhe-guren-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./shanhe-guren

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
