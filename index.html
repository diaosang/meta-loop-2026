<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Loop · 你的游戏正在玩你</title><style>:root{--bg:#090b14;--p:#121728;--l:#293450;--c:#6ce7ff;--m:#ff6fb5;--t:#eef3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#242b50,transparent 38%),var(--bg);color:var(--t);font:15px ui-monospace,monospace}.wrap{max-width:1000px;width:92%;margin:auto;padding:30px 0}.ey{color:var(--c);font-size:11px;letter-spacing:.15em}h1{font:700 58px system-ui;margin:8px 0;letter-spacing:-.06em}h1 i{color:var(--m);font-style:normal}.tag{color:#8d96af;text-align:right}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:#121728ee;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 14px 50px #0006}.arena{min-height:470px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;color:#8d96af;font-size:12px}.ok{color:#b4f46a}.orb{flex:1;display:grid;place-items:center}.orb button{width:230px;height:230px;border:0;border-radius:50%;color:#fff;font:bold 15px monospace;background:radial-gradient(circle at 35% 25%,#fff 0 2%,#6ce7ff 4% 10%,#2d799e 25%,#612b62 67%,#171426 70%);box-shadow:0 0 38px #6ce7ff99,inset -20px -20px 50px #0009;cursor:pointer}.orb button:active{transform:scale(.94)}.meter{height:10px;background:#293047;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--c),var(--m));width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#0c101b;border:1px solid var(--l);border-radius:10px;padding:10px}.stat b{display:block;color:var(--c);font:700 22px system-ui}.stat small{color:#8d96af}h2{font:700 18px system-ui;margin:0 0 12px}h3{color:#8d96af;font-size:12px;margin:20px 0 8px}.choice{border-left:3px solid var(--m);background:#1b1626;padding:12px;color:#dccfe1;margin-bottom:12px}button.act{width:100%;display:flex;justify-content:space-between;background:#1a2238;border:1px solid var(--l);border-radius:9px;padding:10px;color:var(--t);cursor:pointer;margin:8px 0;font:inherit}.act strong{color:#b4f46a}.act small{display:block;color:#8d96af;text-align:left}.log{height:100px;overflow:auto;color:#8d96af;font-size:12px}.foot{text-align:center;color:#8d96af;font-size:11px;margin-top:16px}@media(max-width:700px){.head{display:block}.tag{text-align:left}.grid{grid-template-columns:1fr}h1{font-size:45px}}</style><main class="wrap"><header class="head"><div><div class="ey">// META-GAME / BUILD 0.7</div><h1>Meta <i>Loop</i></h1></div><div class="tag">你以为你在升级角色。<br>角色知道你在升级它。</div></header><div class="grid"><section class="card arena"><div class="top"><span id="world">WORLD_01 · THE LOOP</span><span class="ok">ONLINE</span></div><div class="orb"><button id="orb">点击<br>收集回响</button></div><div class="top"><span>本轮稳定度</span><span id="meter">0 / 250</span></div><div class="meter"><div class="fill" id="fill"></div></div><div class="stats"><div class="stat"><b id="echo">0</b><small>回响 ECHOES</small></div><div class="stat"><b id="loop">0</b><small>循环 LOOPS</small></div><div class="stat"><b id="mult">x1</b><small>灵感倍率</small></div></div></section><aside class="card"><h2>控制台 / CONSOLE</h2><div class="choice" id="say">系统在等你做一件看似无意义的事。</div><h3>模块升级</h3><button class="act" id="a1"><span><strong>自动回响</strong><small>每秒产生回响</small></span><span>◈25</span></button><button class="act" id="a2"><span><strong>递归记忆</strong><small>点击收益 +1</small></span><span>◈80</span></button><button class="act" id="a3"><span><strong>越界协议</strong><small>解锁下一层世界</small></span><span>◈250</span></button><h3>运行日志</h3><div class="log" id="log"></div><button class="act" id="reset">重启本轮</button></aside></div><div class="foot">当你觉得“差不多了”，那就是系统最想要的时刻。 · 本地自动保存</div></main><script>let s=JSON.parse(localStorage.getItem('ml')||'null')||{e:0,l:0,c:1,a:0,w:1},cost=[25,80,250],q=['你按下了按钮。世界假装没看见。','回响在边缘聚集。','检测到玩家注意力：稳定。','一个小小的循环，正在变得自我意识。','系统建议：继续。'],g=x=>document.getElementById(x);function log(x){g('log').innerHTML='<div>› '+x+'</div>'+g('log').innerHTML}function show(){g('echo').textContent=Math.floor(s.e);g('loop').textContent=s.l;g('mult').textContent='x'+s.c;g('world').textContent='WORLD_0'+s.w+' · '+(s.w>1?'OUTSIDE THE LOOP':'THE LOOP');g('fill').style.width=Math.min(100,s.e/2.5)+'%';g('meter').textContent=Math.floor(s.e%250)+' / 250';localStorage.setItem('ml',JSON.stringify(s))}g('orb').onclick=()=>{s.e+=s.c;s.l++;g('say').textContent=q[s.l%q.length];log(q[s.l%q.length]);show()};function buy(i){if(s.e<cost[i])return;s.e-=cost[i];if(i==0)s.a++;if(i==1)s.c++;if(i==2){s.w++;s.c+=2;log('你找到了菜单之外的菜单。')}cost[i]=Math.ceil(cost[i]*1.65);show()}g('a1').onclick=()=>buy(0);g('a2').onclick=()=>buy(1);g('a3').onclick=()=>buy(2);g('reset').onclick=()=>{s.e=0;s.l=0;log('本轮已重启。你还是你。');show()};setInterval(()=>{if(s.a){s.e+=s.a*.4;show()}},1000);log('连接建立。欢迎回来，玩家。');show()</script>
