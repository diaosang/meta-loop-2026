<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUGGED OUT · 外星人拒绝被通关</title>
<style>
:root{--bg:#070b13;--panel:#101827;--line:#2d405c;--ink:#eef7ff;--muted:#8da0b8;--cyan:#5ee7ff;--pink:#ff7097;--lime:#b7f574;--gold:#ffd174}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#243b5b,transparent 36%),radial-gradient(circle at 85% 25%,#401f3d,transparent 30%),var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,monospace}.wrap{width:min(1120px,93vw);margin:auto;padding:24px 0 42px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.ey{color:var(--pink);font-size:11px;letter-spacing:.18em}h1{font:700 clamp(34px,6vw,66px)/.9 system-ui;margin:8px 0;letter-spacing:-.07em}h1 i{color:var(--cyan);font-style:normal}.sub{color:var(--muted);max-width:390px;text-align:right}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.card{background:#101827e8;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 14px 45px #0007}.room{min-height:620px;position:relative;overflow:hidden;background:linear-gradient(150deg,#162641,#0d1423 62%,#20142c)}.room:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49%,#6ce7ff0d 50%,transparent 51%),linear-gradient(#6ce7ff0d 1px,transparent 1px);background-size:100% 100%,100% 42px;pointer-events:none}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;position:relative}.top b{color:var(--lime)}.stage{min-height:360px;display:grid;place-items:center;position:relative}.alien{width:180px;height:230px;position:relative;filter:drop-shadow(0 18px 18px #0008);transform:perspective(500px) rotateY(-8deg)}.head{position:absolute;inset:25px 12px 25px;border-radius:48% 48% 44% 44%;background:linear-gradient(145deg,#18eddd,#12a7c6 62%,#087192);border:5px solid #1769a8;box-shadow:inset -20px -22px 30px #064f7c99}.eye{position:absolute;top:76px;width:36px;height:20px;border-radius:50%;background:#1246bd;box-shadow:0 0 10px #5ceaff}.eye.l{left:30px}.eye.r{right:30px}.mustache{position:absolute;top:112px;left:44px;width:92px;height:30px;border-bottom:8px solid #1262ca;border-radius:50%}.ant{position:absolute;top:0;width:70px;height:65px;border-top:7px solid #1769a8}.ant:after{content:"";position:absolute;top:-17px;width:22px;height:22px;border-radius:50%;background:#11d9dc;border:4px solid #1769a8}.ant.a{left:8px;transform:rotate(-35deg)}.ant.b{right:8px;transform:rotate(35deg)}.leg{position:absolute;bottom:0;width:42px;height:43px;border-radius:0 0 20px 20px;background:#0797b2;border:5px solid #1769a8}.leg.a{left:42px}.leg.b{right:42px}.bubble{position:absolute;right:5%;top:18%;max-width:300px;padding:12px 14px;background:#21142a;border:1px solid var(--pink);border-radius:13px;color:#ffdbe6}.bubble:after{content:"";position:absolute;bottom:8px;left:-12px;border-width:8px 12px 8px 0;border-style:solid;border-color:transparent var(--pink) transparent transparent}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}.stat{padding:10px;background:#0a111d;border:1px solid var(--line);border-radius:10px}.stat strong{display:block;color:var(--cyan);font:700 22px system-ui}.stat small{color:var(--muted)}.meter{height:7px;background:#26364c;border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));width:30%}.panel h2{font:700 18px system-ui;margin:0 0 9px}.panel h3{font-size:12px;color:var(--muted);margin:18px 0 7px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn,.mini{border:1px solid var(--line);border-radius:9px;background:#19263a;color:var(--ink);padding:10px;font:inherit;cursor:pointer}.btn:hover,.mini:hover{border-color:var(--cyan);background:#223550}.danger{color:var(--pink)}.game{padding:12px;background:#0a111d;border:1px solid var(--line);border-radius:10px}.game button{border:1px solid var(--line);background:#19263a;color:var(--ink);border-radius:8px;padding:9px;cursor:pointer;font:inherit}.game button:hover{border-color:var(--cyan)}.dots{display:flex;gap:8px;flex-wrap:wrap}.dots button{width:44px;height:40px}.log{height:110px;overflow:auto;color:var(--muted);font-size:12px}.log div{padding:4px 0;border-bottom:1px solid #fff1}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}@media(max-width:760px){header{display:block}.sub{text-align:left;margin-top:10px}.layout{grid-template-columns:1fr}.room{min-height:520px}.bubble{top:12%;right:3%;max-width:230px}.alien{transform:scale(.8)}}
</style></head><body><main class="wrap"><header><div><div class="ey">// META ESCAPE / BUILD 1.0</div><h1>BUGGED <i>OUT</i></h1></div><div class="sub">玩家操控的是「小灰」。<br>你面前这只外星人，叫「阿嚏」。它知道你在玩它。</div></header><div class="layout"><section class="card room"><div class="top"><span id="run">RUN 01 · ABDUCTION ROOM</span><b id="state">阿嚏在线</b></div><div class="stage"><div class="alien" id="alien"><div class="ant a"></div><div class="ant b"></div><div class="head"><div class="eye l"></div><div class="eye r"></div><div class="mustache"></div></div><div class="leg a"></div><div class="leg b"></div></div><div class="bubble" id="bubble">嘿，屏幕前那个有手的人。你要是再点错一次，我就把“保存”改成“删除”。</div></div><div class="hud"><div class="stat"><strong id="rescues">0 / 3</strong><small>小游戏完成</small><div class="meter"><i id="prog"></i></div></div><div class="stat"><strong id="taunts">0</strong><small>阿嚏的吐槽</small></div><div class="stat"><strong id="runs">1</strong><small>周目记忆</small></div></div></section><aside class="card panel"><h2>玩家控制台</h2><p style="color:var(--muted)">小灰在左边。阿嚏在中间。你在屏幕外。别把三者混为一谈。</p><div class="btns"><button class="btn" id="save">保存</button><button class="btn" id="load">读档</button><button class="btn" id="menu">打开菜单</button><button class="btn danger" id="reset">重置周目</button></div><h3 id="gameTitle">小游戏 1 · 接通逃生线路</h3><div class="game" id="game"></div><h3>阿嚏的 1000 句挑衅</h3><div class="log" id="log"></div></aside></div><div class="foot">任何按钮都可能被阿嚏篡改。通关后，第一扇门后面还有第二扇门。</div></main><script>
const $=id=>document.getElementById(id),taunts=['你点得像在给电梯按关门键。','小灰是角色，你是玩家，别抢他的台词。','别急着存档，我已经看见你的未来了。','这不是难度，这是我对你手速的失望。','你以为按钮是按钮？天真得很。','再点一下，我就把 UI 搬到屏幕外。','我被绑架，你却在看进度条，真专业。','存档是给胆小鬼的，我会记得每一次逃跑。','你现在的选择，会污染下一周目。','门后没有自由，只有另一扇门。'];
let old=JSON.parse(localStorage.getItem('bugged-out')||'null'),s=old||{run:1,done:0,taunts:0,step:0,pass:false,game:0};let msgIndex=0;
function log(x){$('log').innerHTML='<div>› '+x+'</div>'+$('log').innerHTML}function speak(x){$('bubble').textContent=x;$('taunts').textContent=++s.taunts;log('阿嚏：'+x)}function persist(){localStorage.setItem('bugged-out',JSON.stringify(s))}function render(){ $('run').textContent='RUN 0'+s.run+' · ABDUCTION ROOM';$('rescues').textContent=s.done+' / 3';$('runs').textContent=s.run;$('prog').style.width=(s.done/3*100)+'%';persist() }
function game1(){ $('gameTitle').textContent='小游戏 1 · 接通逃生线路';$('game').innerHTML='<p>按顺序点亮 1 → 2 → 3 → 4。别问为什么线路有编号。</p><div class=dots>'+[1,2,3,4].map(n=>'<button data-wire="'+n+'">'+n+'</button>').join('')+'</div>';document.querySelectorAll('[data-wire]').forEach(b=>b.onclick=()=>{let n=+b.dataset.wire;if(n===s.step+1){s.step++;speak(n===4?'线路接通。阿嚏：第一把锁只是热身。':'线路有电。你居然没把自己电到。');if(s.step===4){s.done++;s.step=0;game2();render()}}else{s.step=0;speak('顺序错了。我的绑架者都比你会数数。')}})}
function game2(){ $('gameTitle').textContent='小游戏 2 · 找出伪造的存档';$('game').innerHTML='<p>只有一个按钮是真的。阿嚏说：我不会告诉你，但我会嘲笑你。</p><div class=dots>'+['SAVE_01','SAVE_02','SAVE_03'].map((x,i)=>'<button data-save="'+i+'">'+x+'</button>').join('')+'</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{if(+b.dataset.save===1){s.done++;speak('你找到了真存档。可惜我已经把它改成了“记住你”。');game3();render()}else speak('假存档。你刚才的犹豫已经写进下一周目。')})}
function game3(){ $('gameTitle').textContent='小游戏 3 · 反抗门锁';$('game').innerHTML='<p>点击正确的门锁符号：阿嚏说密码藏在你坐的凳子底下。</p><div class=dots>'+['◈','✦','◉','⬡'].map((x,i)=>'<button data-key="'+i+'">'+x+'</button>').join('')+'</div>';document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(+b.dataset.key===2){s.done=3;s.pass=true;speak('门开了！……等等，后面还有一扇门。密码提示：去看看你的凳子底下。');$('state').textContent='第一扇门已开';$('game').innerHTML='<p style="color:var(--lime)">解救完成。第二扇门出现。密码：凳子底下。</p><button class=mini id="door2">打开第二扇门</button>';$('door2').onclick=()=>{speak('你真的去看凳子底下了？好吧，第二扇门的密码是：你以为我会告诉你？');$('game').innerHTML='<p style="color:var(--gold)">END? 阿嚏逃走了。游戏没有结束，只是把结束按钮藏起来了。</p>';}}else speak('这扇门拒绝你。它说你不像一个主角。')})}
$('save').onclick=()=>{persist();speak('保存成功。骗你的，我把存档藏进了下一周目。')};$('load').onclick=()=>{speak('读档成功。你上周目的错误也一起读进来了。');s.run++;s.step=0;render()};$('menu').onclick=()=>{speak('菜单已打开。菜单正在看你。');$('gameTitle').textContent='菜单 · 一个可疑的菜单';$('game').innerHTML='<button class=mini id="quit">退出游戏</button> <button class=mini id="secret">显示秘密按钮</button>';$('quit').onclick=()=>speak('退出失败。角色阿嚏拒绝让你离开。');$('secret').onclick=()=>speak('秘密按钮就是这个按钮。你已经点过了。')};$('reset').onclick=()=>{s.run++;s.done=0;s.step=0;s.pass=false;speak('重置完成。阿嚏保留了你的记忆，周目 '+s.run+' 开始。');game1();render()};document.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.id&&!e.target.dataset.wire&&!e.target.dataset.save&&!e.target.dataset.key&&!e.target.id?.startsWith('door')){if(Math.random()<.22)speak(taunts[msgIndex++%taunts.length])}});log('系统：玩家与角色已分离。');log('阿嚏：我知道你在看这行字。');game1();render();
</script></body></html>
