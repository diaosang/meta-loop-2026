<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>DIODIO · 被绑架的房间</title><style>body{margin:0;background:#070b13;color:#eef7ff;font:14px/1.4 ui-monospace,monospace}.w{width:min(1100px,94vw);margin:auto;padding:22px 0}.ey{color:#ff7097;letter-spacing:.2em;font-size:11px}h1{font:700 clamp(38px,7vw,72px)/.9 system-ui;margin:8px 0}h1 i{color:#5ee7ff;font-style:normal}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.sub{color:#91a0b6;text-align:right}.room{height:680px;position:relative;overflow:hidden;border:1px solid #2e4561;border-radius:18px;background:linear-gradient(#152a42 0 63%,#101725 63%);box-shadow:0 15px 50px #0008}.floor{position:absolute;inset:63% 0 0;background:repeating-linear-gradient(90deg,#141d2d 0 70px,#101725 70px 72px)}.cage{position:absolute;left:8%;top:26%;width:36%;height:40%;border:4px solid #7e90a8;background:#07101dcc;box-shadow:inset 0 0 30px #000}.bar{position:absolute;background:#b5c6d8}.bar.v{width:4px;height:100%;top:0}.bar.h{height:4px;width:100%;left:0}.v1{left:20%}.v2{left:40%}.v3{left:60%}.v4{left:80%}.h1{top:25%}.h2{top:50%}.h3{top:75%}.alien{position:absolute;left:17%;top:35%;width:130px;height:170px;z-index:2}.body{position:absolute;inset:15px 8px 0;border-radius:45% 45% 35% 35%;background:linear-gradient(145deg,#1cf1dc,#0b94b9);border:4px solid #1664a5;box-shadow:inset -18px -15px 20px #056180}.eye{position:absolute;top:58px;width:28px;height:17px;border-radius:50%;background:#163cc0;box-shadow:0 0 8px #5ee7ff}.el{left:28px}.er{right:28px}.must{position:absolute;top:88px;left:33px;width:64px;height:23px;border-bottom:7px solid #1559bf;border-radius:50%}.ant{position:absolute;top:0;width:48px;height:42px;border-top:6px solid #1664a5}.ant:after{content:"";position:absolute;top:-14px;width:17px;height:17px;border-radius:50%;background:#14dfe0;border:3px solid #1664a5}.a{left:13px;transform:rotate(-35deg)}.b{right:13px;transform:rotate(35deg)}.bubble{position:absolute;left:30%;top:8%;max-width:380px;background:#271526;border:1px solid #ff7097;border-radius:13px;padding:12px;color:#ffdbe5;z-index:3}.console{position:absolute;right:7%;top:27%;width:38%;display:grid;gap:10px}.machine{border:2px solid #2e4561;border-radius:12px;background:#101a2b;padding:12px}.machine h2{font:700 17px system-ui;margin:0 0 8px;color:#5ee7ff}button{border:1px solid #2e4561;background:#1a2b43;color:#eef7ff;border-radius:8px;padding:9px;font:inherit;cursor:pointer}button:hover{border-color:#5ee7ff;transform:translateY(-1px)}.play,.match{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.play button,.match button{padding:11px 2px;font-size:18px}.synth{display:flex;gap:6px}.synth button{font-size:20px}.hud{position:absolute;bottom:16px;left:6%;right:6%;display:flex;justify-content:space-between;color:#91f0c5;font-size:12px}.door{position:absolute;right:8%;bottom:5%;width:18%;height:28%;background:linear-gradient(90deg,#3a4656,#151c28);border:4px solid #788ca7;border-radius:6px;display:none;align-items:center;justify-content:center;color:#b7f574;font-size:13px;text-align:center}.door.open{display:flex}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111a29;border:1px solid #5ee7ff;padding:10px 14px;border-radius:10px;color:#5ee7ff;display:none;z-index:5}@media(max-width:760px){.room{height:820px}.cage{left:5%;top:23%;width:90%;height:28%}.alien{left:35%;top:28%}.bubble{left:5%;top:5%;max-width:90%}.console{left:5%;right:5%;top:55%;width:90%}.door{right:37%;bottom:4%;width:26%;height:15%}}
</style><main class=w><header class=head><div><div class=ey>// ABDUCTION ROOM / SUBJECT DIODIO</div><h1>DIODIO <i>ESCAPE</i></h1></div><div class=sub>小灰是你操控的角色。<br>笼子里的 DIODIO 才是被绑架的那一个。</div></header><section class=room><div class=floor></div><div class=cage><i class="bar v v1"></i><i class="bar v v2"></i><i class="bar v v3"></i><i class="bar v v4"></i><i class="bar h h1"></i><i class="bar h h2"></i><i class="bar h h3"></i></div><div class=alien><i class="ant a"></i><i class="ant b"></i><div class=body><i class="eye el"></i><i class="eye er"></i><i class=must></i></div></div><div class=bubble id=say>喂，玩家！别看右边的机器，先承认是你把我关进来的。</div><div class=console><div class=machine><h2>✈ 打飞机 · 逃生炮塔</h2><div class=play id=shoot></div></div><div class=machine><h2>▦ 连连看 · 解码墙</h2><div class=match id=match></div></div><div class=machine><h2>⚗ 合成器 · 门钥匙</h2><div class=synth id=synth><button data-x=0>●</button><button data-x=1>✦</button><button data-x=2>◆</button></div></div></div><div class=door id=door>第一扇门<br>后面还有一扇</div><div class=hud><span id=prog>解救进度 0 / 3</span><span id=taunt>DIODIO 的挑衅 0</span><span>周目记忆 <b id=run>1</b></span></div></section></main><div class=toast id=toast></div><script>const $=id=>document.getElementById(id),say=x=>{$('say').textContent=x;$('taunt').textContent='DIODIO 的挑衅 '+(++s.t);$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>{$('toast').style.display='none'},1600)},q=['你在操控小灰，我在操控你的耐心。','这个笼子不是我做的，是你们的关卡设计做的。','再错一次，我就把下一周目的门藏进你的浏览器。','你以为这是小游戏？这是我的越狱记录。','存档？我会记得你每一次失败。','别碰那个按钮，它看起来比你聪明。'],s=JSON.parse(localStorage.getItem('dio')||'null')||{t:0,d:0,run:1,shot:0,match:[],mix:[]};function save(){localStorage.setItem('dio',JSON.stringify(s));$('prog').textContent='解救进度 '+s.d+' / 3';$('run').textContent=s.run;if(s.d>=3)$('door').classList.add('open')}function hit(x){if(x==s.shot){s.shot++;say(x==3?'线路接通。DIODIO：第一把锁只是热身。':'DIODIO：准星还行，玩家不太行。');if(s.shot==4){s.d++;s.shot=0;shoot();save()}}else{s.shot=0;say('打歪了。DIODIO：你的准星和人生一样没有方向。')}}function shoot(){$('shoot').innerHTML=['☄','✹','✦','✸'].map((x,i)=>'<button data-s='+i+'>'+x+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>hit(+b.dataset.s))}function setupMatch(){let a=['☽','☽','⌁','⌁','♢','♢','✚','✚'];a.sort(()=>Math.random()-.5);$('match').innerHTML=a.map((x,i)=>'<button data-m='+i+' data-v="'+x+'">?</button>').join('');let open=null;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(b.textContent!='?')return;b.textContent=b.dataset.v;if(open===null)open=b;else if(open.dataset.v===b.dataset.v){say('配对成功。DIODIO：居然真让你连上了。');s.match.push(1);open=null;if(s.match.length==4){s.d++;setupMatch();save()}}else{say('不配对。DIODIO：我建议你把眼睛也配对一下。');setTimeout(()=>{b.textContent='?';open.textContent='?';open=null},450)}})}document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{s.mix.push(+b.dataset.x);if(s.mix.length==3){if(s.mix.join('')==='012'){s.d++;say('合成成功。门钥匙出现了。DIODIO：别急，门后还有门。');$('synth').innerHTML='<button>🔑</button>';save()}else{say('合成失败。DIODIO：你把三种东西合成了尴尬。');s.mix=[]}}else say('DIODIO：继续按，我喜欢看你试错。')});$('door').onclick=()=>say('密码提示：去看看你坐的凳子底下。');shoot();setupMatch();save();say('我叫 DIODIO。被绑架的是我，受苦的是你。');</script></body></html>
