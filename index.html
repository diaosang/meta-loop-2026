<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>DIODIO · Abduction Room</title><style>
:root{--bg:#070b12;--wall:#14253b;--floor:#111723;--line:#35506b;--cyan:#57e7ff;--pink:#ff6f96;--lime:#b8f57a;--muted:#91a5bc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#345378,transparent 44%),var(--bg);color:#eef7ff;font:14px/1.45 ui-monospace,monospace}.wrap{width:min(1120px,94vw);margin:auto;padding:22px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.ey{color:var(--pink);font-size:11px;letter-spacing:.2em}h1{font:700 clamp(38px,7vw,70px)/.9 system-ui;margin:8px 0}h1 i{color:var(--cyan);font-style:normal}.sub{color:var(--muted);text-align:right}.room{height:700px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(#1a3551 0 60%,#101724 60%);box-shadow:0 20px 60px #0009}.wall-light{position:absolute;top:10%;left:50%;width:360px;height:260px;transform:translateX(-50%);background:#58cfff12;clip-path:polygon(36% 0,64% 0,100% 100%,0 100%)}.floor{position:absolute;inset:60% 0 0;background:linear-gradient(#1b2535,#0d131e);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 70px,#2e405222 71px),repeating-linear-gradient(0deg,transparent 0 45px,#2e405222 46px);transform:perspective(300px) rotateX(48deg);transform-origin:top}.panel{position:absolute;left:6%;top:12%;width:22%;height:23%;padding:12px;border:2px solid #63809d;background:#0a111d;box-shadow:0 10px 20px #0008}.panel b{color:var(--cyan)}.light{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);margin:4px}.cage{position:absolute;left:8%;top:32%;width:35%;height:35%;border:4px solid #9bb0c5;background:#07101dcc;box-shadow:inset 0 0 35px #000}.bar{position:absolute;background:#b5c6d8}.bar.v{width:4px;height:100%}.bar.h{height:4px;width:100%}.v1{left:20%}.v2{left:40%}.v3{left:60%}.v4{left:80%}.h1{top:25%}.h2{top:50%}.h3{top:75%}.alien{position:absolute;left:17%;top:40%;width:130px;height:170px;z-index:2}.body{position:absolute;inset:15px 8px 0;border-radius:45% 45% 35% 35%;background:linear-gradient(145deg,#1cf1dc,#0b94b9);border:4px solid #1664a5;box-shadow:inset -18px -15px 20px #056180}.eye{position:absolute;top:58px;width:28px;height:17px;border-radius:50%;background:#163cc0;box-shadow:0 0 8px var(--cyan)}.el{left:28px}.er{right:28px}.must{position:absolute;top:88px;left:33px;width:64px;height:23px;border-bottom:7px solid #1559bf;border-radius:50%}.ant{position:absolute;top:0;width:48px;height:42px;border-top:6px solid #1664a5}.ant:after{content:"";position:absolute;top:-14px;width:17px;height:17px;border-radius:50%;background:#14dfe0;border:3px solid #1664a5}.a{left:13px;transform:rotate(-35deg)}.b{right:13px;transform:rotate(35deg)}.bubble{position:absolute;left:30%;top:10%;max-width:410px;background:#281625;border:1px solid var(--pink);border-radius:13px;padding:12px;color:#ffdbe5;z-index:3}.console{position:absolute;right:5%;top:20%;width:40%;display:grid;gap:8px}.machine{border:2px solid var(--line);border-radius:12px;background:#0f1928eF;padding:10px}.machine h2{font:700 16px system-ui;color:var(--cyan);margin:0 0 7px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.machine button{width:100%;background:#1a2b43;color:#eef7ff;border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;font:inherit}.machine button:hover{border-color:var(--cyan)}.door{position:absolute;right:8%;bottom:5%;width:18%;height:28%;background:linear-gradient(90deg,#465467,#151d2a);border:4px solid #91a5bc;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--lime);cursor:pointer}.door.locked{color:var(--pink)}.hud{position:absolute;left:6%;right:6%;bottom:14px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#101a29;border:1px solid var(--cyan);color:var(--cyan);padding:10px 14px;border-radius:8px;display:none;z-index:8}@media(max-width:760px){.room{height:920px}.panel{top:10%;width:45%;height:16%}.cage{left:5%;top:29%;width:90%;height:25%}.alien{left:36%;top:34%}.bubble{left:5%;top:3%;max-width:90%}.console{left:5%;right:5%;top:56%;width:90%}.door{right:36%;bottom:3%;width:28%;height:12%}.hud{bottom:2px}}
.maze button{font-size:16px;padding:12px}.maze .here{background:#5ee7ff;color:#07101a}.maze .exit{background:#b7f574;color:#07101a}.meter{height:7px;background:#09111d;border:1px solid #35506b;border-radius:9px;margin:6px 0 8px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#57e7ff,#b8f57a);transition:width .25s}.mixstate{color:#b8f57a;font-size:11px;min-height:18px;margin-bottom:5px}</style><main class=wrap><header class=head><div><div class=ey>// ABDUCTION ROOM / SUBJECT DIODIO</div><h1>DIODIO <i>ESCAPE</i></h1></div><div class=sub>小灰由玩家操控。<br>DIODIO 被锁在房间中央。</div></header><section class=room><div class=wall-light></div><div class=floor></div><div class=panel><b>CAPTURE CONTROL</b><br><span class=light></span><span class=light></span><span class=light></span><p style="color:var(--muted);font-size:11px">监控：玩家可见<br>逃生协议：未授权</p></div><div class=cage><i class="bar v v1"></i><i class="bar v v2"></i><i class="bar v v3"></i><i class="bar v v4"></i><i class="bar h h1"></i><i class="bar h h2"></i><i class="bar h h3"></i></div><div class=alien><i class="ant a"></i><i class="ant b"></i><div class=body><i class="eye el"></i><i class="eye er"></i><i class=must></i></div></div><div class=bubble id=say>我是 DIODIO。被绑架的是我，丢脸的是你。</div><div class=console><div class=machine><h2>🛸 轨道拦截 · 点掉无人机</h2><div class="meter"><span id="shotbar"></span></div><div class=grid4 id=shoot></div></div><div class=machine><h2>▦ 解码墙</h2><div class=grid4 id=match></div></div><div class=machine><h2>🧪 反应釜 · 调出解冻液</h2><div class="mixstate" id="mixstate">反应釜待机：先放入蓝盐</div><div class=grid4 id=synth><button data-mix=0>蓝盐</button><button data-mix=1>离子胶</button><button data-mix=2>冷光</button></div></div></div><div class="door locked" id=door>LOCKED<br>3 个系统仍在运行</div><div class=hud><span id=progress>解救进度 0 / 3</span><span id=counter>DIODIO 台词 0 / 24</span><span>周目 <b id=run>1</b></span></div></section></main><div class=toast id=toast></div><script>
const $=id=>document.getElementById(id);const lines=['你终于来了，小灰的手指比你可靠。','这不是房间，是一个很贵的错误。','别碰红灯，我和它已经达成了互相讨厌。','你把我关进笼子，却把自己关在教程里。','我看见你在找隐藏按钮，继续丢人。','这一面墙的砖块比你的解谜逻辑更整齐。','你不是主角，你是输入设备。','我会记住你失败的顺序。','这台机器在播放我的逃跑录像，你看不懂吗。','不要相信“完成”，那是界面骗你的。','如果你读到这句，说明我已经越过一层规则。','小灰正在看你，别让他失望。','我建议你把每个按钮都当成嫌疑人。','你按得很快，思考得很慢。','这把锁没有钥匙，只有耐心。','你以为下一周目会清零？可爱。','我不是 NPC，我是被迫上班的演员。','这里的灯光比你的计划更有方向。','三种符号合成不了勇气，但能合成门钥匙。','你把错误叫尝试，把失败叫体验。','离开笼子之后，我要投诉你。','这句话只出现一次，珍惜你的记忆。','房间正在缩小，还是你的视野在缩小？','门后还有门，别装作惊讶。'];let s={done:0,run:1,shot:0,turn:0,mix:[],pairs:0};let used=[];function speak(){let pool=lines.filter(x=>!used.includes(x));if(!pool.length){used=[];pool=lines}let x=pool[Math.floor(Math.random()*pool.length)];used.push(x);s.turn++;$('say').textContent=x;$('counter').textContent='DIODIO 台词 '+s.turn+' / 24';$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>{$('toast').style.display='none'},1300);saveState()}function saveState(){localStorage.setItem('dio-room',JSON.stringify({done:s.done,run:s.run,turn:s.turn}))}function update(){ $('progress').textContent='解救进度 '+s.done+' / 3';$('run').textContent=s.run;if(s.done>=3){$('door').classList.remove('locked');$('door').innerHTML='OPEN<br>后面还有一扇门'}}function shoot(){
  s.shot=0; let target=-1; const total=7; const board=$('shoot');
  const paint=()=>{target=Math.floor(Math.random()*12);board.innerHTML=Array.from({length:12},(_,i)=>`<button data-target="${i===target}">${i===target?'🛸':'·'}</button>`).join('');board.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.target==='true'){s.shot++;$('shotbar').style.width=(s.shot/total*100)+'%';speak(['命中一架无人机。DIODIO：你终于把准星对准了现实。','拦截成功。DIODIO：别欢呼，那只是最笨的一架。','警报少了一盏。DIODIO：我承认，你的手速有点用。'][s.shot%3]);if(s.shot>=total){s.done++;speak('轨道拦截完成。DIODIO：炮塔暂时听你的，别得意。');update();setTimeout(shoot,500)}else paint()}else{speak(['那是墙上的灰尘，不是敌人。','你打中了空气，空气表示无辜。','DIODIO：瞄准会动的东西，拜托。'][Math.floor(Math.random()*3)])}})}; paint();
}
function match(){let a=['☽','☽','⌁','⌁','♢','♢','✚','✚'];a.sort(()=>Math.random()-.5);$('match').innerHTML=a.map((x,i)=>'<button data-card='+i+' data-value="'+x+'">?</button>').join('');let first=null;document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(b.textContent!=='?')return;b.textContent=b.dataset.value;if(first===null)first=b;else if(first.dataset.value===b.dataset.value){s.pairs++;first=null;speak('配对成功。DIODIO：这面墙终于承认你有一点用。');if(s.pairs===4){s.done++;s.pairs=0;match();update()}}else{let old=first;first=null;speak('符号不一样。DIODIO：我建议你先记住眼前的东西。');setTimeout(()=>{old.textContent='?';b.textContent='?'},400)}})}
function mix(){let recipe=[0,2,1];s.mix=[];let names=['蓝盐','离子胶','冷光'];const state=()=>{$('mixstate').textContent=s.mix.length?`反应釜：${s.mix.map(x=>names[x]).join(' + ')}${s.mix.length<3?' · 下一步加入 '+names[recipe[s.mix.length]]:''}`:'反应釜待机：先放入蓝盐'};document.querySelectorAll('[data-mix]').forEach(b=>b.onclick=()=>{let x=+b.dataset.mix;if(x!==recipe[s.mix.length]){s.mix=[];state();speak('反应釜冒出紫烟。DIODIO：配方错了，别把我冻成一块纪念品。');return}s.mix.push(x);b.animate([{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:180});state();speak('材料被吸入反应釜。DIODIO：这一步还算像个聪明人。');if(s.mix.length===3){s.done++;s.mix=[];state();$('synth').innerHTML='<button style="background:#b7f574;color:#07101a" disabled>解冻液已稳定</button>';speak('解冻液稳定。DIODIO：快把它倒进笼子的接口。');update()}})}
$('door').onclick=()=>s.done>=3?speak():(speak());shoot();match();mix();update();speak();
</script></body></html>
