<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DIODIO · 绑架房间</title>
<style>
:root{--bg:#070b12;--wall:#17283d;--floor:#101824;--line:#405c78;--cyan:#62e9ff;--pink:#ff759c;--lime:#baf878;--gold:#ffc857;--muted:#9aafc6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#304e70 0,#0b111b 45%,#05070c 100%);color:#eff8ff;font:13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}body{display:grid;place-items:center;padding:12px;overflow-x:hidden}.game-shell{width:min(94vw,470px);display:flex;flex-direction:column;gap:8px}.topline{display:flex;justify-content:space-between;align-items:end;padding:0 4px}.ey{font-size:10px;letter-spacing:.17em;color:var(--pink)}h1{font:800 clamp(28px,10vw,46px)/.85 system-ui;margin:5px 0 0}h1 i{font-style:normal;color:var(--cyan)}.run{color:var(--muted);font-size:11px;text-align:right}.room{position:relative;width:100%;height:min(820px,calc(100vh - 92px));min-height:650px;overflow:hidden;border:2px solid #45617c;border-radius:22px;background:linear-gradient(#1a3550 0 62%,#101824 62%);box-shadow:0 22px 70px #000b}.room:before{content:"";position:absolute;left:10%;right:10%;top:9%;height:2px;background:#6e8aa3;box-shadow:0 78px 0 #6e8aa322,0 150px 0 #6e8aa322}.wall-light{position:absolute;top:0;left:50%;width:290px;height:285px;transform:translateX(-50%);background:#7bdfff16;clip-path:polygon(36% 0,64% 0,100% 100%,0 100%)}.floor{position:absolute;inset:62% 0 0;background:linear-gradient(#1c2938,#0a1019)}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 54px,#38506c2b 55px),repeating-linear-gradient(0deg,transparent 0 38px,#38506c2b 39px);transform:perspective(300px) rotateX(48deg);transform-origin:top}.status{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;z-index:5}.status b{color:var(--lime)}
/* alien tied from the ceiling */
.alienRig{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:160px;height:205px;z-index:4}.hook{position:absolute;left:50%;top:-23px;height:55px;border-left:3px solid #c9d8e5;transform:translateX(-50%)}.rope{position:absolute;top:17px;width:18px;height:130px;border:3px solid #d5c19b;border-bottom:0;border-radius:45% 45% 0 0;z-index:4}.rope.left{left:42px;transform:rotate(19deg)}.rope.right{right:42px;transform:rotate(-19deg)}.ropeKnot{position:absolute;top:119px;width:24px;height:13px;border:3px solid #d5c19b;border-radius:50%;z-index:6}.ropeKnot.left{left:35px}.ropeKnot.right{right:35px}.antenna{position:absolute;top:27px;width:49px;height:48px;border-top:7px solid #18649d;z-index:3}.antenna:after{content:"";position:absolute;top:-16px;width:18px;height:18px;border-radius:50%;background:#16e2db;border:3px solid #17669d}.antenna.left{left:31px;transform:rotate(-34deg)}.antenna.right{right:31px;transform:rotate(34deg)}.antenna.left:after{left:-2px}.antenna.right:after{right:-2px}.alienBody{position:absolute;left:17px;right:17px;top:48px;height:150px;border-radius:48% 48% 34% 34%;background:linear-gradient(145deg,#1ff1d6,#0a8daf);border:4px solid #155f9a;box-shadow:inset -20px -17px 24px #056080}.eye{position:absolute;top:47px;width:31px;height:19px;border-radius:50%;background:#1439bf;box-shadow:0 0 9px var(--cyan)}.eye.left{left:30px}.eye.right{right:30px}.mouth{position:absolute;top:82px;left:37px;width:64px;height:26px;border-bottom:7px solid #1559bf;border-radius:50%}.wrist{position:absolute;top:132px;width:29px;height:11px;border:3px solid #d5c19b;border-radius:50%;z-index:6}.wrist.left{left:2px;transform:rotate(-28deg)}.wrist.right{right:2px;transform:rotate(28deg)}.tauntBubble{position:absolute;top:4%;left:50%;transform:translateX(-50%);width:88%;padding:9px 11px;border:1px solid var(--pink);background:#291525eF;border-radius:12px;color:#ffdce7;z-index:25;pointer-events:none;box-shadow:0 4px 18px #0007;text-align:center}.tauntBubble:after{content:"";position:absolute;left:50%;bottom:-9px;border:9px solid transparent;border-top-color:var(--pink);transform:translateX(-50%)}
/* scene props and chest hotspots */
.prop{position:absolute;border:2px solid #536b83;background:#0a111bd9;border-radius:12px;z-index:3;box-shadow:0 9px 18px #0008}.propLabel{display:block;color:#b7c9da;font-size:10px;margin-bottom:4px}.chest{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:80px;height:45px;border:3px solid #c89534;border-radius:7px;background:linear-gradient(#e4b94f,#8c5e19);color:#251603;font-weight:bold;cursor:pointer;box-shadow:0 0 0 3px #ffc85733,0 0 16px #ffc85755;z-index:2}.chest:before{content:"▣";font-size:22px}.chest.done{filter:grayscale(.7);opacity:.65;box-shadow:none}.computer{left:6%;top:40%;width:42%;height:116px;padding:8px}.screen{height:62px;border:4px solid #5a7186;background:#07111b;color:var(--cyan);display:grid;place-items:center;font-size:18px}.computer .chest{bottom:-53px}.wardrobe{right:6%;top:34%;width:38%;height:220px;padding:8px;background:linear-gradient(90deg,#4a3023,#1c1513);border-color:#8f6547}.wardrobe:before,.wardrobe:after{content:"";position:absolute;top:16px;bottom:64px;width:45%;border:2px solid #8c6346;background:#291b17}.wardrobe:before{left:4%}.wardrobe:after{right:4%}.wardrobe .chest{bottom:8px}.carpet{left:10%;right:10%;bottom:15%;height:105px;padding:10px;text-align:center;background:repeating-linear-gradient(135deg,#55284a 0 12px,#692e59 12px 24px);border-color:#b8649c}.carpet .chest{bottom:-52px}.carpet .footprints{font-size:24px;letter-spacing:9px;color:#ffc5ec;margin-top:6px}.hotspotHint{position:absolute;left:0;right:0;bottom:2px;color:var(--gold);font-size:9px;text-align:center}.door{position:absolute;right:8%;bottom:5%;width:23%;height:18%;border:4px solid #91a5bc;background:linear-gradient(90deg,#465467,#151d2a);display:grid;place-items:center;text-align:center;color:var(--pink);font-weight:bold;cursor:pointer;z-index:2}.door.open{color:var(--lime);box-shadow:0 0 24px #b8f57a66}.doorHint{font-size:9px;color:#b9cbe0}
/* modal games */
.modal{position:absolute;inset:0;background:#050912d9;display:none;place-items:center;z-index:20;padding:18px}.modal.show{display:grid}.card{width:100%;max-width:380px;border:2px solid var(--cyan);border-radius:16px;background:#0d1725;box-shadow:0 15px 40px #000c;padding:15px}.card h2{margin:0 0 3px;color:var(--cyan);font:700 20px system-ui}.desc{font-size:11px;color:var(--muted);margin-bottom:8px}.timerRow{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.timer{font-size:24px;color:var(--gold);font-weight:bold}.timer.danger{color:var(--pink);animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}.keyReward{color:var(--lime);font-size:12px}.gameBoard{display:grid;gap:7px}.gameBoard button,.card .close{border:1px solid var(--line);border-radius:8px;background:#172a42;color:#eff8ff;padding:12px;font:inherit;cursor:pointer}.gameBoard button:hover,.card .close:hover{border-color:var(--cyan)}.computerBoard{grid-template-columns:repeat(4,1fr)}.computerBoard button{font-size:19px;padding:14px 4px}.wardrobeBoard{grid-template-columns:repeat(3,1fr)}.wardrobeBoard button.on{background:#d99745;color:#221407}.carpetBoard{grid-template-columns:repeat(4,1fr)}.carpetBoard button{font-size:20px;height:55px}.carpetBoard button.step{background:#b8f57a;color:#07101a}.card .close{width:100%;margin-top:10px;background:#101e30;color:var(--muted)}.message{min-height:20px;color:#ffdce7;font-size:11px;margin-top:8px}
@media(max-height:700px){.room{height:calc(100vh - 86px);min-height:590px}.alienRig{top:6%;transform:translateX(-50%) scale(.82);transform-origin:top center}.computer{top:36%}.wardrobe{top:31%;height:190px}.carpet{bottom:15%;height:90px}}
</style>
</head>
<body>
<main class="game-shell">
  <header class="topline"><div><div class="ey">// ABDUCTION ROOM / SUBJECT DIODIO</div><h1>DIODIO <i>ESCAPE</i></h1></div><div class="run">竖屏房间<br>周目 <b id="run">1</b></div></header>
  <section class="room" id="room" data-context="房间地板">
    <div class="wall-light"></div><div class="floor"></div>
    <div class="tauntBubble" id="taunt" data-no-taunt>DIODIO：欢迎参观我的绑架现场，别碰错东西。</div>
    <div class="alienRig" data-context="DIODIO的触角"><div class="hook"></div><div class="rope left"></div><div class="rope right"></div><div class="antenna left"></div><div class="antenna right"></div><div class="alienBody"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div><div class="ropeKnot left"></div><div class="ropeKnot right"></div><div class="wrist left"></div><div class="wrist right"></div></div>
    <div class="prop computer" data-context="电脑屏幕"><span class="propLabel">电脑终端 · 轨道拦截</span><div class="screen">SIGNAL ▦ ▦ ▦</div><button class="chest" id="chest-computer" data-game="computer" data-context="电脑上的宝箱" aria-label="打开电脑宝箱"></button><div class="hotspotHint">点击宝箱打开游戏</div></div>
    <div class="prop wardrobe" data-context="衣柜"><span class="propLabel">衣柜 · 灯线控制</span><button class="chest" id="chest-wardrobe" data-game="wardrobe" data-context="衣柜里的宝箱" aria-label="打开衣柜宝箱"></button><div class="hotspotHint">柜门后有锁</div></div>
    <div class="prop carpet" data-context="地毯"><span class="propLabel">地毯 · 足迹校验</span><div class="footprints">⌂　⌂　⌂　⌂</div><button class="chest" id="chest-carpet" data-game="carpet" data-context="地毯上的宝箱" aria-label="打开地毯宝箱"></button><div class="hotspotHint">踩对脚印才能取钥匙</div></div>
    <div class="door" id="door" data-context="房间的门"><span>LOCKED<br><span class="doorHint">集齐 3 把钥匙</span></span></div>
    <div class="status"><span id="progress">钥匙 0 / 3</span><span>台词 <b id="tauntCount">1</b> / 1000</span></div>
    <div class="modal" id="modal" data-no-taunt><div class="card"><h2 id="gameTitle">小游戏</h2><div class="desc" id="gameDesc"></div><div class="timerRow"><span class="timer" id="timer">15</span><span class="keyReward" id="reward">完成后获得钥匙</span></div><div class="gameBoard" id="gameBoard"></div><div class="message" id="gameMessage"></div><button class="close" id="closeGame">暂时离开</button></div></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const keys={computer:false,wardrobe:false,carpet:false};
let activeGame=null,timerId=null,remaining=15,computerTarget=0,wardrobePattern=[],wardrobeInput=[],carpetPath=[],carpetInput=[],tauntIndex=0,run=1,escaping=false,gameOver=false;
const starts=['你点到{ctx}，还以为自己','刚碰到{ctx}，就开始','{ctx}被你按响之后，DIODIO看见你','你对着{ctx}伸手，像是在','{ctx}收到你的点击，记录下你','你选择了{ctx}，这让DIODIO','点击{ctx}的瞬间，房间发现你','{ctx}被你盯上了，DIODIO觉得你','你又在{ctx}上浪费一秒，看来你','当你触碰{ctx}时，绑在上面的DIODIO'];
const verbs=['在认真逃生','把按钮当成了护身符','离真相还差一整条走廊','把笨拙伪装成策略','让监控摄像头笑出了雪花','把我的逃跑计划推进了一格','证明了手指比脑子更积极','差点把房间的耐心用光','成功触发了新的嘲笑协议','让这场绑架多了一位喜剧演员'];
const ends=['，继续吧，我还没看够。','，但钥匙不会因为可爱自动出现。','，别急，门后还有我的吐槽。','，你要是再快一点也许能骗过灯。','，这一步我先替你记在失败簿上。','，连地毯都知道你走错了。','，柜门正在考虑要不要配合你。','，电脑把你的操作存成了笑话。','，我被绑着都比你更有方向感。','，放心，这句是专门给你留的。'];
function taunt(ctx='未知角落'){if(tauntIndex>=1000)return;const i=tauntIndex++,msg=starts[Math.floor(i/100)].replace('{ctx}',ctx)+verbs[Math.floor(i/10)%10]+ends[i%10];$('taunt').textContent='DIODIO：'+msg;$('tauntCount').textContent=Math.min(tauntIndex,1000);localStorage.setItem('dio-taunt-index',tauntIndex)}
function load(){const saved=JSON.parse(localStorage.getItem('dio-meta-room')||'{}');Object.assign(keys,saved.keys||{});tauntIndex=Math.min(+(localStorage.getItem('dio-taunt-index')||0),1000);run=saved.run||1;$('run').textContent=run;updateKeys();}
function save(){localStorage.setItem('dio-meta-room',JSON.stringify({keys,run}))}
function updateKeys(){const count=Object.values(keys).filter(Boolean).length;$('progress').textContent='钥匙 '+count+' / 3';Object.entries(keys).forEach(([k,v])=>{const b=$('chest-'+k);if(b)b.classList.toggle('done',v)});$('door').classList.toggle('open',count===3);$('door').innerHTML=count===3?'<span>OPEN<br><span class="doorHint">点击离开房间</span></span>':'<span>LOCKED<br><span class="doorHint">集齐 3 把钥匙</span></span>'}
function startTimer(){clearInterval(timerId);gameOver=false;remaining=15;renderTimer();timerId=setInterval(()=>{remaining--;renderTimer();if(remaining<=0){gameOver=true;clearInterval(timerId);$('gameMessage').textContent='时间到！DIODIO：倒计时都能输，你很稳定。';setTimeout(()=>closeGame(),700)}},1000)}
function renderTimer(){$('timer').textContent=remaining;$('timer').classList.toggle('danger',remaining<=5)}
function openGame(game){if(keys[game]){taunt('已经打开的宝箱');return}activeGame=game;$('modal').classList.add('show');$('gameMessage').textContent='';$('reward').textContent='完成后获得钥匙';if(game==='computer')setupComputer();if(game==='wardrobe')setupWardrobe();if(game==='carpet')setupCarpet();startTimer();taunt(game==='computer'?'电脑宝箱':game==='wardrobe'?'衣柜宝箱':'地毯宝箱')}
function closeGame(){clearInterval(timerId);timerId=null;activeGame=null;$('modal').classList.remove('show');}
function winGame(){if(gameOver||!activeGame)return;gameOver=true;clearInterval(timerId);keys[activeGame]=true;save();$('gameMessage').textContent='钥匙已取得！DIODIO：你居然完成了。';$('reward').textContent='✓ 已获得钥匙';updateKeys();taunt('刚到手的钥匙');setTimeout(closeGame,900)}
function setupComputer(){ $('gameTitle').textContent='电脑终端：拦截无人机';$('gameDesc').textContent='找到发光的无人机，连续命中 5 次。点错会扣 2 秒。';const board=$('gameBoard');board.className='gameBoard computerBoard';let hits=0;const paint=()=>{computerTarget=Math.floor(Math.random()*12);board.innerHTML=Array.from({length:12},(_,i)=>`<button data-no-taunt data-target="${i===computerTarget}">${i===computerTarget?'🛸':'·'}</button>`).join('');board.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.target==='true'){hits++;taunt('电脑上的无人机');if(hits>=5)winGame();else paint()}else{remaining=Math.max(1,remaining-2);renderTimer();taunt('电脑上的空位')}})};paint()}
function setupWardrobe(){ $('gameTitle').textContent='衣柜：接通灯线';$('gameDesc').textContent='记住亮灯顺序，再按同样顺序点回去。';const board=$('gameBoard');board.className='gameBoard wardrobeBoard';wardrobePattern=Array.from({length:4},()=>Math.floor(Math.random()*6));wardrobeInput=[];board.innerHTML=Array.from({length:6},(_,i)=>`<button data-no-taunt data-switch="${i}">开关 ${i+1}</button>`).join('');const show=async()=>{for(const i of wardrobePattern){const b=board.querySelector(`[data-switch="${i}"]`);b.classList.add('on');await new Promise(r=>setTimeout(r,330));b.classList.remove('on');await new Promise(r=>setTimeout(r,120))}board.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.switch;wardrobeInput.push(i);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),160);taunt('衣柜的灯线');if(i!==wardrobePattern[wardrobeInput.length-1]){wardrobeInput=[];$('gameMessage').textContent='顺序错了，灯线重新闪烁。';taunt('衣柜里的错误开关');show()}else if(wardrobeInput.length===wardrobePattern.length)winGame()})};show()}
function setupCarpet(){ $('gameTitle').textContent='地毯：踩出逃生路径';$('gameDesc').textContent='按脚印从左到右踩完，踩错会重新排列。';const board=$('gameBoard');board.className='gameBoard carpetBoard';carpetPath=[0,3,6,9].sort(()=>Math.random()-.5);carpetInput=[];board.innerHTML=Array.from({length:12},(_,i)=>`<button data-no-taunt data-step="${i}">${carpetPath.includes(i)?'👣':'·'}</button>`).join('');board.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.step;if(i!==carpetPath[carpetInput.length]){carpetInput=[];$('gameMessage').textContent='脚印陷阱！从第一步重来。';taunt('地毯上的错误脚印');return}carpetInput.push(i);b.classList.add('step');taunt('地毯上的脚印');if(carpetInput.length===carpetPath.length)winGame()})}
$('closeGame').onclick=()=>{taunt('关闭小游戏的按钮');closeGame()};document.querySelectorAll('[data-game]').forEach(b=>b.onclick=e=>{e.stopPropagation();openGame(b.dataset.game)});$('door').onclick=()=>{if(escaping)return;if(Object.values(keys).every(Boolean)){escaping=true;taunt('已经解锁的门');$('door').innerHTML='<span>逃出成功<br><span class="doorHint">DIODIO：门外还有下一周目</span></span>';setTimeout(()=>{run++;Object.keys(keys).forEach(k=>keys[k]=false);escaping=false;save();$('run').textContent=run;updateKeys();taunt('下一周目的门')},1200)}else taunt('锁住的房门')};document.addEventListener('click',e=>{if(e.target.closest('[data-no-taunt]')||e.target.closest('[data-game]')||e.target.closest('#door'))return;const area=e.target.closest('[data-context]');taunt(area?.dataset.context||'房间的空气')});load();$('tauntCount').textContent=Math.min(tauntIndex,1000);taunt('房间入口');
</script>
</body></html>
