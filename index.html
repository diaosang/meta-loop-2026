<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Signal Garden · 信号花园</title><style>body{margin:0;background:#0a101c;color:#edf5ff;font:15px/1.5 system-ui,monospace}.wrap{max-width:1000px;width:92%;margin:auto;padding:30px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.ey{color:#8df0c5;font-size:11px;letter-spacing:.16em}h1{font-size:58px;line-height:.9;margin:10px 0}.lead{color:#91a1b8;text-align:right}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card{background:#121c2c;border:1px solid #2b3a54;border-radius:16px;padding:20px;box-shadow:0 15px 45px #0007}.scene{min-height:500px;display:flex;flex-direction:column}.bar{display:flex;justify-content:space-between;color:#91a1b8;font-size:12px}.round{color:#8df0c5}.garden{flex:1;display:grid;place-items:center}.core{width:240px;height:240px;border-radius:50%;display:grid;place-items:center;text-align:center;border:1px solid #8df0c566;background:radial-gradient(circle,#d9fff1,#75d6ae 8%,#225d5a 30%,#151d34 68%,#0c101c 70%);box-shadow:0 0 70px #8df0c52b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0c1320;border:1px solid #2b3a54;border-radius:10px;padding:10px}.stat b{display:block;color:#8df0c5;font-size:23px}.stat small{color:#91a1b8}.brief{border-left:3px solid #ffd27a;background:#2a2317;color:#ffe8b7;padding:11px;margin:10px 0}.choices{display:grid;gap:9px}.choice{background:#18243a;color:#edf5ff;border:1px solid #2b3a54;border-radius:10px;padding:12px;text-align:left;font:inherit;cursor:pointer}.choice:hover{border-color:#8df0c5}.choice:disabled{opacity:.4}.choice strong{display:block;color:#8df0c5}.choice small{color:#91a1b8}.log{height:120px;overflow:auto;color:#91a1b8;font-size:12px}.reset{margin-top:10px;background:transparent;color:#91a1b8;border:1px solid #2b3a54;border-radius:8px;padding:8px;font:inherit}@media(max-width:700px){.head{display:block}.lead{text-align:left}.grid{grid-template-columns:1fr}.core{width:210px;height:210px}}</style><main class=wrap><header class=head><div><div class=ey>// META-NARRATIVE / SESSION 05</div><h1>Signal <span style="color:#8df0c5">Garden</span></h1></div><div class=lead>这座花园会读取你的选择。<br>五回合后，它会告诉你：你到底在保护谁。</div></header><div class=grid><section class="card scene"><div class=bar><span id=chapter>CHAPTER 01 · SEED</span><span class=round id=turn>回合 1 / 5</span></div><div class=garden><div class=core><span id=core>信号种子<br>正在聆听</span></div></div><div class=stats><div class=stat><b id=trust>50</b><small>信任 TRUST</small></div><div class=stat><b id=energy>5</b><small>能量 ENERGY</small></div><div class=stat><b id=noise>0</b><small>噪声 NOISE</small></div></div></section><aside class=card><h2 id=title>夜里的第一束光</h2><div class=brief id=brief>花园里传来一个熟悉的声音。它说：不要急着证明你是对的。</div><h3>选择你的回应</h3><div class=choices><button class=choice data-i=0><strong>靠近聆听</strong><small>信任 +12 · 能量 -1</small></button><button class=choice data-i=1><strong>打开探照灯</strong><small>能量 +2 · 噪声 +10</small></button><button class=choice data-i=2><strong>记录后离开</strong><small>信任 -4 · 噪声 -6</small></button></div><h3>花园日志</h3><div class=log id=log></div><button class=reset id=reset>重新开始这局</button></aside></div></main><script>const $=x=>document.getElementById(x),sc=[['CHAPTER 01 · SEED','夜里的第一束光','花园里传来一个熟悉的声音。它说：不要急着证明你是对的。'],['CHAPTER 02 · ROOTS','地下的回声','根系把一段旧记忆推到地面：有人曾经因为沉默而获救。'],['CHAPTER 03 · THORNS','围墙外的访客','门外站着一个没有影子的人。他知道你的名字，却拒绝说明来处。'],['CHAPTER 04 · BLOOM','花正在开','整座花园同时发亮。你终于看见：信号一直来自你身后。'],['CHAPTER 05 · RETURN','最后一个问题','种子问：如果没有人看见，你还会选择同样的方式吗？']],out=[['它没有后退。安静本身变成了一种语言。',12,-1,0],['光穿透了花瓣。所有东西都清晰了，也都开始刺耳。',0,2,10],['你留下了记录。风把纸页翻到下一面。',-4,0,-6]],s={t:1,tr:50,en:5,no:0,end:0};function log(x){$('log').innerHTML='<div>› '+x+'</div>'+$('log').innerHTML}function view(){let x=sc[s.t-1];$('chapter').textContent=x[0];$('turn').textContent=s.end?'SESSION COMPLETE':'回合 '+s.t+' / 5';$('title').textContent=x[1];$('brief').textContent=x[2];$('trust').textContent=s.tr;$('energy').textContent=s.en;$('noise').textContent=s.no;document.querySelectorAll('.choice').forEach(b=>b.disabled=s.end||s.en<1);if(s.end){let z=s.tr>=65?'它把花园交给了你。你学会了保护一段不属于你的生命。':s.no>=25?'花园熄灭了，但你的答案留下了回声。':'种子没有开花。它只是安静地活过了这五回合。';$('core').innerHTML=z.replace('。','。<br>');$('brief').textContent=z}}function choose(i){if(s.end||s.en<1)return;let o=out[i];s.tr=Math.max(0,Math.min(100,s.tr+o[1]));s.en=Math.max(0,s.en+o[2]-1);s.no=Math.max(0,s.no+o[3]);log(o[0]);if(s.t==5){s.end=1;log('五回合结束。花园正在读取你的答案。')}else s.t++;view()}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('reset').onclick=()=>{s={t:1,tr:50,en:5,no:0,end:0};$('core').innerHTML='信号种子<br>正在聆听';$('log').innerHTML='';log('新的种子已落下。');view()};log('连接建立。花园没有要求你证明什么。');view();</script>
