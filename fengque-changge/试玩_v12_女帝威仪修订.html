<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凤阙长歌 · V12.1 女帝威仪修订试玩</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#241b24;color:#f7eee6;font-family:"Noto Serif SC","Songti SC",serif}
header{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#3f2b3a;border-bottom:1px solid #80606c}
header strong{font-size:13px;letter-spacing:2px}
header span{font-size:11px;color:#e2cbd0}
main{height:calc(100% - 48px)}
iframe{display:block;width:100%;height:100%;border:0;background:#fffaf5}
</style>
</head>
<body>
<header><strong>凤阙长歌 · V12.1</strong><span id="status">正在载入 V12 宫廷世界……</span></header>
<main><iframe id="game" title="凤阙长歌 V12.1 女帝威仪修订试玩" src="./试玩_v12.html"></iframe></main>
<script>
(function(){
  var frame=document.getElementById('game');
  var status=document.getElementById('status');
  var done=false;
  frame.addEventListener('load',function(){
    if(done)return;
    done=true;
    try{
      var doc=frame.contentDocument;
      if(!doc)throw new Error('无法访问游戏文档');
      var script=doc.createElement('script');
      script.src='./源代码/demo-imperial-tone-v12.js?v=12.1';
      script.onload=function(){
        var win=frame.contentWindow;
        if(!win.__FENGQUE_IMPERIAL_TONE_V121__||typeof win.__fengqueImperialToneAudit!=='function'){
          status.textContent='V12 已载入，但威仪修订层未启用';
          return;
        }
        status.textContent='V12.1 女帝威仪修订已启用 · 可以开始游玩';
      };
      script.onerror=function(){status.textContent='V12 已载入，但修订脚本未能下载，请刷新重试';};
      doc.head.appendChild(script);
    }catch(error){
      status.textContent='页面载入失败，请刷新重试';
      console.error(error);
    }
  });
})();
</script>
</body>
</html>
