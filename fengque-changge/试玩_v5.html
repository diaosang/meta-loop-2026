<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>凤阙长歌 · v5活人感对话试玩</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#211a20;color:#f8eee5;font-family:"Noto Serif SC","Songti SC",serif}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#382833;border-bottom:1px solid #84645a}
header b{letter-spacing:3px;font-size:15px}header span{font-size:11px;color:#d8c0a6}
main{height:calc(100% - 54px);position:relative}iframe{display:block;border:0;width:100%;height:100%;background:#f7f0e8}
#status{position:absolute;z-index:2;right:14px;top:12px;padding:7px 11px;border:1px solid #cfb38b;border-radius:20px;background:#fff8e9;color:#604653;font-size:11px;box-shadow:0 3px 12px #170d1640}
</style>
</head>
<body>
<header><b>凤阙长歌</b><span>v5 · 群像对话 / 心境反应 / 自愿选秀</span></header>
<main>
<div id="status">正在载入完整宫廷世界……</div>
<iframe id="game" title="凤阙长歌完整试玩" src="https://htmlpreview.github.io/?https://raw.githubusercontent.com/diaosang/meta-loop-2026/main/fengque-changge/index.html"></iframe>
</main>
<script>
(function(){
 const frame=document.getElementById('game'),status=document.getElementById('status');
 const extension='https://raw.githubusercontent.com/diaosang/meta-loop-2026/main/fengque-changge/%E6%BA%90%E4%BB%A3%E7%A0%81/demo-dialogue-expansion.js';
 let applied=false;
 frame.addEventListener('load',async function(){
  if(applied)return;
  try{
   status.textContent='正在载入人物专属对话库……';
   const response=await fetch(extension,{cache:'no-store'});
   if(!response.ok)throw new Error('对话扩展文件读取失败：'+response.status);
   const source=await response.text();
   const target=frame.contentWindow;
   if(!target||!target.document)throw new Error('试玩页面尚未就绪');
   target.eval(source);
   if(typeof target.render==='function')target.render();
   applied=true;
   status.textContent='v5对话系统已载入 · 可开始试玩';
   setTimeout(()=>status.style.opacity='0.88',1800);
  }catch(error){
   status.textContent='扩展载入未成功：请刷新页面，或直接打开基础Demo';
   console.error(error);
  }
 });
})();
</script>
</body>
</html>
