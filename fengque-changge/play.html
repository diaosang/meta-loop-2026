<script>
const DIALOGUE_LIBRARY = [{"id": "SC001", "category": 0, "topic": "recent", "title": "新换的茶", "stage": "茶盏刚端上来，你闻见一点焦香。", "player": "今日的茶好像不同？", "core": "茶房换了焙法，我刚试过，不苦。", "follow": "茶若太浓，告诉我，我替你换一盏。", "location": "study"}, {"id": "SC002", "category": 0, "topic": "recent", "title": "窗外的雀", "stage": "窗台上落着两只麻雀，谁也不肯先飞走。", "player": "你方才在看什么？", "core": "那只小的来抢食，偏又怕那只大的。看了半天，很有意思。", "follow": "你若喜欢，下回我留些碎米。", "location": "garden"}, {"id": "SC003", "category": 0, "topic": "recent", "title": "袖边的墨", "stage": "你看见袖口沾了一小块墨。", "player": "今日忙什么，连衣袖都顾不上？", "core": "字写坏了一张，想改，手肘先碰倒了墨。", "follow": "袖子不急，先把手洗了吧。", "location": "library"}, {"id": "SC004", "category": 0, "topic": "recent", "title": "新出的小吃", "stage": "门外有人提着刚买来的点心。", "player": "闻着香，哪家买的？", "core": "东市新开的小铺，第一炉总卖得快。我赶早才买到。", "follow": "下次出宫，你带我认认路。", "location": "east"}, {"id": "SC005", "category": 0, "topic": "home", "title": "家乡的面", "stage": "窗外起风，灶上正煮着热汤。", "player": "你家乡冷天吃什么？", "core": "一碗热面，浇上萝卜汤。我们那里不放这么多香料。", "follow": "哪日得空，照你的吃法做一碗。", "location": "kitchen"}, {"id": "SC006", "category": 0, "topic": "home", "title": "故乡的雨", "stage": "雨打在檐下，谈话慢慢停了。", "player": "想家了么？", "core": "有一点。家里下雨时，院门总会卡住，要两个人才推得开。", "follow": "想写信就写，我不催你。", "location": "rest"}, {"id": "SC007", "category": 0, "topic": "home", "title": "旧巷的小店", "stage": "你们说到城里卖旧书的地方。", "player": "小时候也爱逛铺子？", "core": "口袋里没钱，也敢站着看半日。掌柜从来没赶过我。", "follow": "等回去时，带一本好书送给他。", "location": "tea"}, {"id": "SC008", "category": 0, "topic": "home", "title": "老树", "stage": "树荫落下来，你问起他从前的住处。", "player": "家里也有这样一棵树？", "core": "有，长得歪。小时候总嫌难看，离家久了，倒记得最清楚。", "follow": "你画给我看，我也认一认。", "location": "garden"}, {"id": "SC009", "category": 0, "topic": "interest", "title": "半卷书", "stage": "一卷书被压在茶杯旁，折角做了记号。", "player": "看到哪里了？", "core": "主角刚走错一条路。我想看看，他肯不肯回头。", "follow": "看完再讲给我听，先别说结局。", "location": "library"}, {"id": "SC010", "category": 0, "topic": "interest", "title": "养花的难处", "stage": "花盆里的新芽才冒出一点。", "player": "这花难养么？", "core": "比想的难。浇多了不行，忘了也不行，我还在学。", "follow": "养不好也不打紧，明年再种。", "location": "garden"}, {"id": "SC011", "category": 0, "topic": "interest", "title": "一场输赢", "stage": "棋盒还没收，桌上留着一盘残局。", "player": "刚才这一局，谁赢了？", "core": "我。可那一步是碰巧想出来的，不好拿来夸口。", "follow": "摆给我看，让我也学一手。", "location": "study"}, {"id": "SC012", "category": 0, "topic": "interest", "title": "闲时出门", "stage": "路边的小摊已经开始收拾。", "player": "不用当值时，你都往哪里去？", "core": "没有定处。哪条街有人卖热食，我就多走一段。", "follow": "下次出门，也叫我一声。", "location": "west"}, {"id": "SC013", "category": 1, "topic": "listen", "title": "茶凉了", "stage": "杯中的茶早已凉透，人却没动。", "player": "怎么坐了这么久？", "core": "事情都处理完了，反倒不知道该做什么。", "follow": "不必找话，我陪你坐一会儿。", "location": "rest"}, {"id": "SC014", "category": 1, "topic": "listen", "title": "话到嘴边", "stage": "一句话起了头，又被咽了回去。", "player": "想说什么就说，我听着。", "core": "我怕这点小事也拿来说，会让您觉得我太难照顾。", "follow": "在我这里，不必总挑好听的说。", "location": "garden"}, {"id": "SC015", "category": 1, "topic": "listen", "title": "不想见人", "stage": "门口的小厮说，今日不接客。", "player": "我也不能进去么？", "core": "您若肯安静坐一会儿，就进来。我今天实在没力气应酬。", "follow": "好，旁的事都不问。", "location": "rest"}, {"id": "SC016", "category": 1, "topic": "comfort", "title": "夜里的灯", "stage": "天色暗了，案上的灯还亮着。", "player": "今日能不能早些歇？", "core": "还剩最后一页。您坐着等我，我就不再添新差事。", "follow": "我在这里等，但只等这一页。", "location": "study"}, {"id": "SC017", "category": 1, "topic": "comfort", "title": "嗓子哑了", "stage": "一句问候说出来，声音比平日低。", "player": "不舒服怎么不说？", "core": "以为喝点水就好，没想到到这会儿还哑着。", "follow": "先别说话，余下的改日听。", "location": "clinic"}, {"id": "SC018", "category": 1, "topic": "comfort", "title": "空了的饭盒", "stage": "送来的饭盒还合着盖。", "player": "饭没吃，还是不合口味？", "core": "忙过了头，刚才才觉得饿。您不要叫人因此挨罚。", "follow": "那就一起吃一点，热着再说。", "location": "kitchen"}, {"id": "SC019", "category": 1, "topic": "gift", "title": "合手的小物", "stage": "你把一个小盒子放到案上。", "player": "路上看到的，想起你就买了。", "core": "原来不是随手赏的。那我便好好收着。", "follow": "喜欢就留着，不喜欢也可以告诉我。", "location": "east"}, {"id": "SC020", "category": 1, "topic": "gift", "title": "不贵的礼物", "stage": "纸包拆开，只是一件寻常小物。", "player": "不贵，别嫌弃。", "core": "我又不是按价钱认心意。您特地带回来，我就高兴。", "follow": "下次喜欢什么，自己指给我看。", "location": "west"}, {"id": "SC021", "category": 1, "topic": "gift", "title": "退回的重礼", "stage": "礼盒停在两人中间，没有打开。", "player": "是不是太贵重了？", "core": "是。我怕收下以后，反倒不敢自在同您说话。", "follow": "那就换件小的，别让礼物难为人。", "location": "study"}, {"id": "SC022", "category": 1, "topic": "promise", "title": "下月的约", "stage": "你们谈到下月的花期。", "player": "到时候一起去看，好不好？", "core": "好。若临时有事，您提前说一声，别让我等到天黑。", "follow": "我记下了，有变动亲自告诉你。", "location": "garden"}, {"id": "SC023", "category": 1, "topic": "promise", "title": "定个日子", "stage": "话说到改日，两个人都停了停。", "player": "不说改日了，就定下月见。", "core": "您这样说，我便真的会空出那一天。", "follow": "那一天留给你，不让人白等。", "location": "rest"}, {"id": "SC024", "category": 1, "topic": "promise", "title": "约见的地点", "stage": "你指了指窗外的回廊。", "player": "下月还在这里等我？", "core": "换到亭子吧。这里风大，您总嫌手冷。", "follow": "好，听你的。", "location": "garden"}, {"id": "SC025", "category": 2, "topic": "support", "title": "把缘由讲明", "stage": "一张安排表被摊开，双方都看得仔细。", "player": "先听我把这样安排的缘由说完。", "core": "若是为了把事情做好，我愿意配合，只要别让我蒙在鼓里。", "follow": "有哪一步顾虑，直接说出来。", "location": "study"}, {"id": "SC026", "category": 2, "topic": "support", "title": "不要空口担保", "stage": "承诺听起来周全，细节却还没落定。", "player": "这件事我会负责，你信我一次。", "core": "我想信。可您得告诉我，出了岔子该找谁。", "follow": "把责任写清，再请你答应。", "location": "office"}, {"id": "SC027", "category": 2, "topic": "support", "title": "给一段期限", "stage": "你把日期圈在纸上，推到对方面前。", "player": "先试十日，不合适再改。", "core": "有个期限就好。若十日后仍不成，也请准我直说。", "follow": "到时候一起看结果。", "location": "study"}, {"id": "SC028", "category": 2, "topic": "support", "title": "留一点余地", "stage": "屋里没有旁人，你放低了声音。", "player": "不必当众表态，想清楚再答我。", "core": "您肯留这点余地，我反倒愿意认真想一想。", "follow": "答不答应，都别勉强自己。", "location": "rest"}, {"id": "SC029", "category": 2, "topic": "work", "title": "一件难差", "stage": "差事不轻，对方迟迟没接话。", "player": "我看中你的本事，但难处也想听。", "core": "本事我会尽，难处却不能装作没有。先把人手给齐吧。", "follow": "该给的支持，不只是一句辛苦。", "location": "office"}, {"id": "SC030", "category": 2, "topic": "work", "title": "换个办法", "stage": "原先的做法卡在了半路。", "player": "照你的想法，换个法子试试？", "core": "那就请您容我先把旧安排停一停，不要两边同时催。", "follow": "我来说明，你把手上的事做好。", "location": "study"}, {"id": "SC031", "category": 2, "topic": "work", "title": "不替人背责", "stage": "说到承担，对方的神色紧了些。", "player": "经手的事各自担责，不让你替人认。", "core": "有您这句话，我才能把实情讲完整。", "follow": "照实说，比顺着我说要紧。", "location": "office"}, {"id": "SC032", "category": 2, "topic": "work", "title": "重新分工", "stage": "两人的分工有了重叠，谁也不好先退。", "player": "只换分工，不是在说你做得不好。", "core": "若不是借此把我晾开，我愿意换个位置试试。", "follow": "做了什么，我会照样记下。", "location": "study"}, {"id": "SC033", "category": 2, "topic": "reconcile", "title": "先不论输赢", "stage": "你没有叫另一人来，只与眼前人谈。", "player": "能不能先不争谁最后一句话？", "core": "我不怕少说一句，怕的是事情就这样含糊过去。", "follow": "该说清的仍要说，别把人也逼走。", "location": "garden"}, {"id": "SC034", "category": 2, "topic": "reconcile", "title": "给台阶", "stage": "你把茶往对方面前推了推。", "player": "给他一个台阶，也是给自己留条路。", "core": "可以。但下次有分歧，希望他也肯当面讲。", "follow": "我会把这句话原样带到。", "location": "tea"}, {"id": "SC035", "category": 2, "topic": "reconcile", "title": "不逼着和好", "stage": "你问起两人之间的隔阂。", "player": "不必立刻和好，先别互相为难。", "core": "这一步我做得到。别的，就让日子慢慢看吧。", "follow": "做到这里已经很好。", "location": "garden"}, {"id": "SC036", "category": 2, "topic": "reconcile", "title": "把公私分开", "stage": "两份意见相左的文书摆在桌上。", "player": "你不喜欢他，也能一起把事做完。", "core": "我知道。公事我不会故意拖，只是不想再陪笑。", "follow": "不用陪笑，照章办就好。", "location": "office"}, {"id": "SC037", "category": 3, "topic": "opinion", "title": "问一句实话", "stage": "你先让旁人退了出去。", "player": "你觉得我最近做得怎样？", "core": "有些地方让我安心，有些地方，我还想再看一看。", "follow": "挑一件说，我不急着反驳。", "location": "study"}, {"id": "SC038", "category": 3, "topic": "opinion", "title": "不求顺耳", "stage": "对方先说了一句一切都好。", "player": "别只说让我高兴的话。", "core": "我怕说了，您当时不恼，过后却不愿见我。", "follow": "不顺耳的话，也该有地方说。", "location": "rest"}, {"id": "SC039", "category": 3, "topic": "opinion", "title": "想不想见", "stage": "你在门边站定，没有径直走近。", "player": "我来，你是真的高兴么？", "core": "高不高兴，您看我有没有把手里的事放下，便知道了。", "follow": "那我今日就多坐一会儿。", "location": "garden"}, {"id": "SC040", "category": 3, "topic": "opinion", "title": "有没有怨", "stage": "你把一句试探说得很轻。", "player": "心里若有怨，可不可以告诉我？", "core": "有一点。但我还在想，怎么说才不会变成吵架。", "follow": "不急，想好了再说。", "location": "rest"}, {"id": "SC041", "category": 3, "topic": "worry", "title": "藏起来的信", "stage": "一封未封口的家书压在镇纸下。", "player": "家里有事么？不方便说也无妨。", "core": "是些家事。我想先自己处理，真有难处再求您。", "follow": "好，你来找我时，我会听。", "location": "study"}, {"id": "SC042", "category": 3, "topic": "worry", "title": "看上去有心事", "stage": "你连问两次，对方才回过神。", "player": "方才想什么，连茶都忘了接？", "core": "有件事没理清，怕说早了让您白担心。", "follow": "只说能说的那一半也好。", "location": "garden"}, {"id": "SC043", "category": 3, "topic": "worry", "title": "不拆穿", "stage": "一句话说得太快，像早就备好了。", "player": "你若不想说，可以直说不想说。", "core": "我确实还没准备好。谢谢您没当面拆开问。", "follow": "那就等你愿意的时候。", "location": "rest"}, {"id": "SC044", "category": 3, "topic": "worry", "title": "想先自己办", "stage": "你发现一件小事被搁了下来。", "player": "是办不成，还是另有打算？", "core": "我想先试自己的办法。没有结果前，不敢向您讨功。", "follow": "结果如何都可以说，别只报好消息。", "location": "office"}, {"id": "SC045", "category": 3, "topic": "relation", "title": "不替人说", "stage": "你提起了另一位熟人的名字。", "player": "你们平日来往多么？", "core": "见过几面。有些话属于他的私事，我不好替他答。", "follow": "我会亲自问，不难为你。", "location": "tea"}, {"id": "SC046", "category": 3, "topic": "relation", "title": "传来的闲话", "stage": "一则传闻已经绕了几个弯。", "player": "这件事你是亲眼见的，还是听来的？", "core": "听来的。所以我先把这句说清，免得您把它当成实据。", "follow": "先记来源，不凭闲话定人。", "location": "post"}, {"id": "SC047", "category": 3, "topic": "relation", "title": "偏心也承认", "stage": "你问起一位与对方交好的人。", "player": "你替他说话，是因为信他么？", "core": "是。我和他有交情，未必看得最公允。您还该问问别人。", "follow": "肯这样说，已经帮了我。", "location": "garden"}, {"id": "SC048", "category": 3, "topic": "relation", "title": "不合也有分寸", "stage": "你提到一位与对方不睦的人。", "player": "你不喜欢他，可知道他究竟做了什么？", "core": "不喜欢是一回事。他没做过的事，我不会往他头上放。", "follow": "分得清这两件事，就好。", "location": "office"}, {"id": "SC049", "category": 4, "topic": "remind", "title": "提醒分寸", "stage": "你把语气放平，免得旁人听成羞辱。", "player": "以后说话，留意一下分寸。", "core": "我听见了。若有哪一句不合适，请您说清楚。", "follow": "说具体的事，不翻旧账。", "location": "study"}, {"id": "SC050", "category": 4, "topic": "remind", "title": "不许抢话", "stage": "谈话还没说完，双方都显得急。", "player": "先让我说完，你也有开口的机会。", "core": "好。我等您说完，也请您真给我一个回答的机会。", "follow": "谁也不必靠抢最后一句取胜。", "location": "office"}, {"id": "SC051", "category": 4, "topic": "remind", "title": "小事不当罪", "stage": "你发觉自己的话有些重，停了一下。", "player": "只是提醒，不是要拿你问罪。", "core": "那就请按小事说。我不想连解释也像在认罪。", "follow": "是我语气重了，重新说。", "location": "rest"}, {"id": "SC052", "category": 4, "topic": "remind", "title": "不替别人受训", "stage": "一件事牵涉几个人，你没有先下结论。", "player": "你只说自己做过的部分。", "core": "该我认的我认，没经手的，也不能一句话就算到我头上。", "follow": "那就逐件说清。", "location": "office"}, {"id": "SC053", "category": 4, "topic": "stern", "title": "当面斥责", "stage": "你没有压低声音，屋里一下静下来。", "player": "我不想再听敷衍。", "core": "您可以不满意，但请别把我没说出口的话都当成敷衍。", "follow": "先听解释，再决定轻重。", "location": "study"}, {"id": "SC054", "category": 4, "topic": "stern", "title": "不留情面", "stage": "一句严厉的话落下，对方没有立刻回答。", "player": "你该知道我为什么生气。", "core": "我知道您生气，却未必知道您认定了什么。请说清楚。", "follow": "把缘由摆出来，不让对方靠猜。", "location": "rest"}, {"id": "SC055", "category": 4, "topic": "stern", "title": "不许含糊", "stage": "你指了指尚未说清的一处。", "player": "这一点，别再含糊。", "core": "我会讲清。若是确实不知道，也请准我说不知道。", "follow": "不知道就查，不用编个答案。", "location": "office"}, {"id": "SC056", "category": 4, "topic": "stern", "title": "无过被责", "stage": "你只因心烦便重了语气。", "player": "今日别再让我不痛快。", "core": "我会退下。但这句话伤人，不会因为您明日忘了，就没有发生。", "follow": "若责错了人，要认真道歉。", "location": "rest"}, {"id": "SC057", "category": 4, "topic": "public", "title": "不准顶嘴", "stage": "你把解释截在了半途。", "player": "我不许你再顶嘴。", "core": "若连解释也算顶嘴，那我今日确实无话可说。", "follow": "停一停，别把沉默当认错。", "location": "study"}, {"id": "SC058", "category": 4, "topic": "public", "title": "在别人面前", "stage": "旁人还在，对方的脸色变了。", "player": "这件事就在这里讲明白。", "core": "可以。既然当众问，也请当众听完，不要只留下责备。", "follow": "留足说话的机会。", "location": "court"}, {"id": "SC059", "category": 4, "topic": "public", "title": "借题敲打", "stage": "你提起的事并不全由此人经手。", "player": "你们都该记住，别来试我的底线。", "core": "我听到了。可我站在这里，也还是想知道自己错在何处。", "follow": "借威势压人，失去的未必只是一句好话。", "location": "study"}, {"id": "SC060", "category": 4, "topic": "public", "title": "说完以后", "stage": "重话已经出口，没人接着说。", "player": "你可以退下了。", "core": "我会走。也请您记得，我不是听不懂，只是没再争。", "follow": "若想挽回，不能只赏一件东西。", "location": "rest"}, {"id": "SC061", "category": 5, "topic": "chess", "title": "一局慢棋", "stage": "你们把计时的漏壶拿远了些。", "player": "今日慢慢下，不赶时间。", "core": "那我就不急着落子了。这一局，咱们多想几步。", "follow": "有输有赢，改日再来。", "location": "garden"}, {"id": "SC062", "category": 5, "topic": "chess", "title": "不必让棋", "stage": "对方把一枚棋子拿起又放下。", "player": "别让我，认真下。", "core": "您说的。输了不许把棋盘一推，当没这回事。", "follow": "我输得起，你也要输得起。", "location": "study"}, {"id": "SC063", "category": 5, "topic": "chess", "title": "请教一步", "stage": "你没看懂眼前的局势，索性问了。", "player": "这一手为何落这里？", "core": "护住这一路，后面才不必处处救急。您试着换个位置看看。", "follow": "把道理讲明，比替我赢有用。", "location": "library"}, {"id": "SC064", "category": 5, "topic": "chess", "title": "残局留着", "stage": "晚膳已来催，棋局还没下完。", "player": "这局先留着，改日继续。", "core": "好，谁也别偷偷改棋。我把这一步记在纸上。", "follow": "给下一次相见，留件具体的事。", "location": "rest"}, {"id": "SC065", "category": 5, "topic": "walk", "title": "一条小路", "stage": "大路有人等着，你指向另一条花径。", "player": "走那边吧，人少些。", "core": "好。难得不用应答旁人，咱们慢慢走。", "follow": "不一定要说话，同行也算相处。", "location": "garden"}, {"id": "SC066", "category": 5, "topic": "walk", "title": "雨停之后", "stage": "石板上还湿着，树叶往下滴水。", "player": "雨停了，出去透口气？", "core": "我拿把伞。未必再下，只是树下还会落水。", "follow": "多走一小段，不赶着回去。", "location": "garden"}, {"id": "SC067", "category": 5, "topic": "walk", "title": "街边停一停", "stage": "小摊上有人捏面人，你们都多看了一眼。", "player": "想看就停，不必赶路。", "core": "那就停一会儿。我想看看最后那一笔怎么捏。", "follow": "喜欢的东西，不必总等别人先说。", "location": "east"}, {"id": "SC068", "category": 5, "topic": "walk", "title": "回去的路", "stage": "灯市散了，人群慢慢少下来。", "player": "还想走一段，还是回去？", "core": "再走一段吧。热闹看过了，这会儿正好说话。", "follow": "让对方也能决定何时结束。", "location": "lantern"}, {"id": "SC069", "category": 5, "topic": "spar", "title": "先试几招", "stage": "演武场上空了半边，你们换了木器。", "player": "点到为止，先让我看看你的招式。", "core": "好。站稳些，别只顾着看手。", "follow": "切磋是相助，不拿输赢羞辱人。", "location": "training"}, {"id": "SC070", "category": 5, "topic": "spar", "title": "重新搭弦", "stage": "箭没有中，你低头重新理弓。", "player": "再教我一次，这回慢些。", "core": "肩放下来。先别急着瞄准，把呼吸稳住。", "follow": "肯耐心教，也是一种亲近。", "location": "training"}, {"id": "SC071", "category": 5, "topic": "spar", "title": "歇一歇", "stage": "两人额上都有了汗，你先把木剑放下。", "player": "歇口气，别硬撑。", "core": "正好。我本来还怕先说停，被您笑话。", "follow": "适时停下，也不算认输。", "location": "training"}, {"id": "SC072", "category": 5, "topic": "spar", "title": "胜负之后", "stage": "这一场分了输赢，笑意却没散。", "player": "今日算你赢，下回再比。", "core": "那我等着。您说过的话，可不能只算到今日。", "follow": "记住共同经历，不只记数值。", "location": "training"}, {"id": "SC073", "category": 6, "topic": "compliment", "title": "一句好看", "stage": "光从窗边落下来，你看了一会儿才开口。", "player": "今日这样，很好看。", "core": "您忽然认真夸一句，我反倒不知道眼睛该往哪里放。", "follow": "夸具体的人，不拿谁作比较。", "location": "garden"}, {"id": "SC074", "category": 6, "topic": "compliment", "title": "听他说话", "stage": "谈话停住，你却还在看对方。", "player": "不是走神，我想听你多说几句。", "core": "那我再说一会儿。只是您这样看，我怕把话都忘了。", "follow": "给喜欢的人一点说不流利的余地。", "location": "rest"}, {"id": "SC075", "category": 6, "topic": "compliment", "title": "不是赏识", "stage": "一句夸赞听起来像寻常嘉奖，你又补了一句。", "player": "今日夸你，没有公事的意思。", "core": "原来不是夸我差事办得好。那这句话，我想留给自己。", "follow": "把欣赏与心意分开说清。", "location": "study"}, {"id": "SC076", "category": 6, "topic": "compliment", "title": "只说这一次", "stage": "你放低声音，免得让旁人听见。", "player": "这句话，我想亲口说给你听。", "core": "亲口说的，我便亲自记着。不劳旁人再传一遍。", "follow": "不拿私下的话当众取笑。", "location": "rest"}, {"id": "SC077", "category": 6, "topic": "miss", "title": "一日没见", "stage": "你问得很轻，像是不急着讨一个答案。", "player": "今日有没有想我？", "core": "有。看见门口有人经过，总会抬一下头。", "follow": "给一点回应，别让期待落空。", "location": "garden"}, {"id": "SC078", "category": 6, "topic": "miss", "title": "想找个理由", "stage": "对方来时手里带着一本书。", "player": "是来送书，还是想见我？", "core": "本来备了好几个理由。您一问，我倒不想用了。", "follow": "想见面，本来就可以是理由。", "location": "library"}, {"id": "SC079", "category": 6, "topic": "miss", "title": "被记住的小事", "stage": "你记起一句随口说过的喜好。", "player": "我也一直记得你说的话。", "core": "那就好。我怕自己记得太清，您却早已忘了。", "follow": "不要随口许下做不到的偏爱。", "location": "rest"}, {"id": "SC080", "category": 6, "topic": "miss", "title": "多留一会儿", "stage": "告辞的话说到了嘴边，脚下却没动。", "player": "若没别的事，再陪我一会儿？", "core": "没有急事。您既然留，我就不装作非走不可了。", "follow": "允许留下，也允许改日。", "location": "study"}, {"id": "SC081", "category": 6, "topic": "confess", "title": "不是玩笑", "stage": "你收了笑，等对方也认真看过来。", "player": "这回是认真的，不拿你取乐。", "core": "您把话说到这里，我也不能再只当听了一句好话。", "follow": "让对方有时间回答。", "location": "rest"}, {"id": "SC082", "category": 6, "topic": "confess", "title": "不急着答", "stage": "心意说出口，你没有立刻靠近。", "player": "不用现在答我，想清楚再说。", "core": "您肯等，我反倒更想认真给一个答复。", "follow": "等待不等于默认答应。", "location": "garden"}, {"id": "SC083", "category": 6, "topic": "confess", "title": "彼此选择", "stage": "你没有提身份，只说了自己的心意。", "player": "我想和你相处，也想知道你愿不愿。", "core": "我愿意慢慢试着走近。若有不舒服的地方，也想能直说。", "follow": "关系需要双方持续同意。", "location": "rest"}, {"id": "SC084", "category": 6, "topic": "confess", "title": "以后怎么相处", "stage": "好听的话说完，眼前还有真实的日子。", "player": "往后你想要怎样的相处？", "core": "别只在高兴的时候来。难过、争执的时候，也让我见得到您。", "follow": "把热恋落到日常安排里。", "location": "rest"}, {"id": "SC085", "category": 7, "topic": "ask", "title": "先问一句", "stage": "夜已深，你没有让人直接带路。", "player": "今夜愿不愿留下？累了便改日。", "core": "先这样问，我就知道自己可以好好回答。", "follow": "先问本人，不拿身份代替意愿。", "location": "rest"}, {"id": "SC086", "category": 7, "topic": "ask", "title": "不要勉强", "stage": "你看见对方有些倦，先把话说在前面。", "player": "若想早些回去，不必顾虑我。", "core": "您把这句话说出来，我心里便放松了。", "follow": "改日相见，也不损伤关系。", "location": "rest"}, {"id": "SC087", "category": 7, "topic": "ask", "title": "留一盏灯", "stage": "寝殿里只剩一盏灯，你指了指靠窗的座位。", "player": "先坐着聊一会儿，好不好？", "core": "好。先说说今日的事，别让人进来催。", "follow": "相处写到夜灯，后续淡出。", "location": "rest"}, {"id": "SC088", "category": 7, "topic": "ask", "title": "把公事放下", "stage": "案上的文书被你合起，推到一边。", "player": "今夜不谈差事，只想和你待着。", "core": "那我也把要替旁人传的话放下。今晚先不说了。", "follow": "亲密不与差事、位分交换。", "location": "rest"}, {"id": "SC089", "category": 7, "topic": "ask", "title": "是否安心", "stage": "你没有催促，等对方自己走近。", "player": "有什么不自在的，可以现在说。", "core": "有一点紧张。您肯让我慢慢来，我就不怕。", "follow": "任何一步都可以停下。", "location": "rest"}, {"id": "SC090", "category": 7, "topic": "ask", "title": "让旁人退下", "stage": "你先屏退了侍从，留下安静的屋子。", "player": "你想让人守在外头，还是离远些？", "core": "在廊下就好。若有事，我还想能叫得到人。", "follow": "尊重安全感，不把独处当考验。", "location": "rest"}, {"id": "SC091", "category": 7, "topic": "ask", "title": "换个日子", "stage": "你听出对方今夜心绪不宁。", "player": "今日不勉强，我们换个日子？", "core": "好。您这样说，我不必一边不安，一边还怕惹您失望。", "follow": "婉拒当晚不扣好感。", "location": "rest"}, {"id": "SC092", "category": 7, "topic": "ask", "title": "先说安排", "stage": "你主动把次日的安排说清。", "player": "明早有事，我会提前告诉你，不让人突然来催。", "core": "那我便安心些。最怕不知道什么时候该走，又不好问。", "follow": "避免清晨失落，约定可兑现。", "location": "rest"}, {"id": "SC093", "category": 7, "topic": "ask", "title": "小小的请求", "stage": "对方像有话想说，你等了一会儿。", "player": "有什么想让我知道的？", "core": "明日不必重赏。若能留一句话，告诉我昨夜相处得好，就够了。", "follow": "不把相处折算成赏银。", "location": "rest"}, {"id": "SC094", "category": 7, "topic": "ask", "title": "留与不留", "stage": "你把选择又交回对方面前。", "player": "我想你留下，但由你自己决定。", "core": "听见前半句我高兴，听见后半句，我才敢信。", "follow": "允许不同性格表达愿意或拒绝。", "location": "rest"}, {"id": "SC095", "category": 7, "topic": "ask", "title": "夜里醒来", "stage": "你们还在说话，外头更声已过。", "player": "若半夜醒了，可以叫我。", "core": "那您也是。别明明醒着，还怕扰了我。", "follow": "只写照顾与陪伴，不写露骨过程。", "location": "rest"}, {"id": "SC096", "category": 7, "topic": "ask", "title": "次日的问候", "stage": "你先提起了天亮以后的事。", "player": "明日醒来，还想一起吃顿早饭。", "core": "好。不是只留一夜，还肯一起吃顿寻常饭，我更喜欢。", "follow": "次日可接续早餐事件。", "location": "rest"}];

 }
 rand(){let x=this.s.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;this.s.seed=x>>>0;return this.s.seed/4294967296;}

 date(){return `昭宁${Math.floor(this.s.turn/12)+1}年 · ${this.s.turn%12+1}月`;}
 log(text,type='world',who=null){this.s.logs.unshift({id:++this.s.uid,turn:this.s.turn,date:this.date(),type,text,who});this.s.logs=this.s.logs.slice(0,250);}
 create(){

  this.setupForeignCities();

 function officeTable(defs=OFFICE_DEFS){return `<table class="list-table"><thead><tr><th>官职 / 职责</th><th>现任</th><th>政 / 文 / 武</th><th>任免</th></tr></thead><tbody>${defs.map(([o,d])=>{const p=game.npc(s.offices[o]);return `<tr><td>${o}<small style="display:block;font-size:9px;margin-top:4px">${d}</small></td><td>${p?btn(esc(p.name),'profile',[p.id],'link-btn'):'空缺'}</td><td>${p?(p.admin||0)+' / '+(p.literature||0)+' / '+(p.military||0):'—'}</td><td>${btn('调任','picker',['office',o])}</td></tr>`;}).join('')}</tbody></table>`;}
  function militaryPanel(){const fronts=(s.invasions||[]).map(w=>{const c=s.countries.find(c=>c.id===w.country),r=game.region(w.region);return `<div class="panel-card danger-card"><h3>${esc(c?.name||'敌军')}进攻${esc(r?.name||'边城')}</h3><p>还需守 ${w.remaining} 个月 · 已守 ${w.held} 次 · 失利 ${w.lost} 次<br>敌方军力 ${c?.power||0} · 守军 ${r?.garrison||0}</p><div class="inline-actions">${btn(w.preparedTurn===s.turn?'本月已增援':'增援 · 银120 粮160','run',['prepareDefense',[w.id]],'primary',w.preparedTurn===s.turn)}${btn('派使者议和','countryWar',[w.country],'danger')}</div></div>`;}).join('');return `<div class="stats-row">${stat('士兵',s.soldiers,'人')}${stat('训练',s.training,'/100')}${stat('武器',s.weapons,'套')}${stat('士气',s.morale,'/100')}${stat('战力',game.combat())}</div><div class="inline-actions">${btn(s.trained?'本月已训练':'练兵 · 银140 粮180','run',['train',[]],'primary',s.trained)}${btn('征兵300 · 银240 粮300','run',['recruit',[]])}${btn('造武器300 · 银120 铁40 木30','run',['forge',[]])}</div>${fronts?`<div class="front-list"><h3>边关急报</h3>${fronts}</div>`:''}`;}
 function caseList(limit=99){return `<div class="panel-grid" style="grid-template-columns:repeat(2,1fr)">${s.cases.filter(c=>!c.closed).slice(0,limit).map(c=>{const report=c.reports?.at(-1);return `<div class="panel-card"><h3>${esc(c.title)}</h3><p>${c.source}呈报 · 涉案人 ${esc(game.npc(c.suspect)?.name)} · 证据 ${c.evidence}/3</p>${c.investigation?'<p class="gold">调查中，下月由刑部尚书汇报。</p>':''}${report?`<p>${esc(report.text)}</p>`:''}<div class="inline-actions">${btn(c.investigation?'调查中':c.evidence>=3?'证据已齐':'调查 · 银100','run',['caseAction',[c.id,'investigate']],'',!!c.investigation||c.evidence>=3)}${btn('包庇','run',['caseAction',[c.id,'protect']])}${btn('问罪','confirmCase',[c.id],c.evidence<2?'danger':'primary')}</div></div>`;}).join('')||empty('暂无待办案件。')}</div>`;}
 function personRow(p){return `<div class="person-row"><div class="mini-portrait">${Art.portrait(p)}</div><div class="person-info"><h3>${esc(p.name)} <small style="font-size:10px">${p.age}岁${p.dead?' · 已故':''}</small></h3><p>${esc(p.office||'无官职')} · ${esc(p.clan)}氏<br>好感 ${p.friend||0}　爱情 ${p.love||0}${p.dead?'':'　'+game.relationGroup(p)}</p></div>${btn('档案 →','profile',[p.id])}</div>`;}

 function render(){const root=$('app');const scroll=$('app').querySelector('.feed')?.scrollTop||0;root.innerHTML=header()+`<div class="layout">${left()}<main class="main">${s.phase==='court'?mapMarkup():privateScene()}${desk()}${navbar()}</main>${feed()}</div><footer class="statusbar"><span>梁宫 · 凤阙长歌 <b>可玩原型 0.3.0</b>　｜　每回合1个月</span><span id="save-status">已自动存档</span><span>适配 1920 × 1080　${btn('使用说明','modal',['help'],'link-btn')}</span></footer>`;if(s.phase==='court'){setupMap();if(!ui.mapReady){recenter();ui.mapReady=true;}else transformMap();}const f=root.querySelector('.feed');if(f)f.scrollTop=scroll;}
 function recenter(){const v=$('map-viewport');if(!v)return;const capital=s.regions.find(r=>r.capital)||{x:20,y:15};ui.pan.z=.83;ui.pan.x=v.clientWidth/2-cx(capital.x)*ui.pan.z;ui.pan.y=v.clientHeight/2-cy(capital.y)*ui.pan.z;transformMap();}
 function overview(){const v=$('map-viewport');if(!v)return;ui.pan.z=Math.min(v.clientWidth/WORLD_MAP.width,v.clientHeight/WORLD_MAP.height)*.94;ui.pan.x=(v.clientWidth-WORLD_MAP.width*ui.pan.z)/2;ui.pan.y=(v.clientHeight-WORLD_MAP.height*ui.pan.z)/2;transformMap();}
 function focusCountry(id){const co=s.countries.find(c=>c.id===id),d=FOREIGN_REALMS[id],v=$('map-viewport');if(!co||!d||!v)return;const rows=Math.ceil(d.count/d.cols);ui.pan.z=Math.min(.75,v.clientWidth/((d.cols+2)*215),v.clientHeight/((rows+3)*170));ui.pan.x=v.clientWidth/2-cx(d.x+(d.cols-1)/2)*ui.pan.z;ui.pan.y=v.clientHeight/2-cy(d.y+(rows-1)/2)*ui.pan.z;ui.selected={kind:'country',id};render();}
 function transformMap(){const el=$('world'),v=$('map-viewport');if(!el||!v)return;const w=WORLD_MAP.width*ui.pan.z,h=WORLD_MAP.height*ui.pan.z;ui.pan.x=w<=v.clientWidth?(v.clientWidth-w)/2:Math.max(v.clientWidth-w-70,Math.min(70,ui.pan.x));ui.pan.y=h<=v.clientHeight?(v.clientHeight-h)/2:Math.max(v.clientHeight-h-70,Math.min(70,ui.pan.y));el.style.transform=`translate(${ui.pan.x}px,${ui.pan.y}px) scale(${ui.pan.z})`;v.closest('.map-area').classList.toggle('is-overview',ui.pan.z<.3);el.querySelectorAll('.national-banner').forEach(g=>g.setAttribute('transform',`scale(${Math.min(8,Math.max(1,.65/ui.pan.z))})`));}
 function setupMap(){const v=$('map-viewport');if(!v)return;let down=null;v.addEventListener('pointerdown',e=>{if(e.button!==0)return;down={x:e.clientX,y:e.clientY,px:ui.pan.x,py:ui.pan.y,moved:false};v.setPointerCapture(e.pointerId);});v.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>5)down.moved=true;if(down.moved){v.classList.add('dragging');ui.pan.x=down.px+dx;ui.pan.y=down.py+dy;transformMap();}});v.addEventListener('pointerup',e=>{if(!down)return;const moved=down.moved;down=null;v.classList.remove('dragging');if(moved)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]');if(target)selectZone(target);else{ui.selected=null;render();}});v.addEventListener('pointercancel',()=>{down=null;v.classList.remove('dragging');});v.addEventListener('wheel',e=>{e.preventDefault();const rect=v.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,old=ui.pan.z,newZ=Math.max(.07,Math.min(1.6,old*(e.deltaY>0?.88:1.13)));ui.pan.x=x-(x-ui.pan.x)*newZ/old;ui.pan.y=y-(y-ui.pan.y)*newZ/old;ui.pan.z=newZ;transformMap();},{passive:false});}
 function selectZone(el){if(el.dataset.zone==='home'){recenter();return;}ui.selected={kind:el.dataset.zone,id:el.dataset.id,x:Number(el.dataset.x),y:Number(el.dataset.y)};if(ui.selected.kind==='region'){const r=game.region(ui.selected.id);if(r&&s.countries.some(c=>c.id===r.owner))ui.selected={kind:'country',id:r.owner,city:r.id};}render();}

 function profileBody(id){const p=game.npc(id);if(!p)return empty('没有找到此人。');const tabs=['介绍','家族树','亲友关系','近期做了什么'];let content='';const active=ui.modal.tab||'介绍';

 function storyBody(story){if(!story)return empty('未找到故事。');const row=game.storyText(story),def=STORY_DEFS.find(d=>d.id===story.def);if(story.status==='complete')return storyHistoryBody(story);return `${tag(story.type)} ${story.country?tag(s.countries.find(c=>c.id===story.country)?.name||'邦交'):''} ${tag('第 '+(story.stage+1)+' / '+game.storyLength(story)+' 章')}<div class="story-scene">${esc(row[0])}</div><div class="stance-row">${game.storyStances(story).map(({p,side})=>`<span class="stance">${esc(p.name)} · 支持方案${side+1}</span>`).join('')}</div>${story.due>s.turn?`<div class="notice">后续还需 ${story.due-s.turn}个月。</div>`:[0,1].map(i=>`<button class="story-choice" data-do="run" data-args="${esc(JSON.stringify(['decide',[story.id,i]]))}"><b>方案${i+1} · ${esc(row[i+1])}</b><small>${effectPreview(row[i+3],story)}${story.country?' · '+(i===0?'相关国家关系 +10':'相关国家关系 -8'):''}<br>支持：好感+3、忠诚+1；反对：好感-3、忠诚-1。上朝行动-1。</small></button>`).join('')}${story.history.length?storyHistoryBody(story):''}`;}
 function effectPreview(e,story){const actor=game.npc(story?.actors?.[0]),other=game.npc(story?.actors?.[1]),name=actor?.name||'相关人物',bondName=actor&&other?`${actor.name}与${other.name}交情`:'双方交情',labels={morale:'士气',money:'银',grain:'粮',wood:'木',iron:'铁',horses:'马',stability:'稳定',friend:name+'好感',love:name+'爱情',loyalty:name+'忠诚',bond:bondName,evidence:'案件证据',art:'艺',literature:'文',military:'武',clanDelta:(e.clan||actor?.clan||'相关')+'氏支持'};return Object.entries(e).filter(([k])=>labels[k]).map(([k,v])=>labels[k]+' '+fmt(v)).join(' · ')||'等待后续';}
 function storyHistoryBody(st){return `<div class="profile-section"><h3>${esc(st.title)} · 前情</h3>${st.history.map((h,i)=>`<div class="story-record"><h3>第${i+1}章 · ${esc(h.choice)}</h3><p>昭宁${Math.floor(h.turn/12)+1}年${h.turn%12+1}月 · ${esc(h.result)}</p></div>`).join('')||empty('尚未处理。')}</div>`;}
 function constructionBody(){let r=game.region(ui.modal.id||'r0');if(!r||r.owner!=='liang')r=s.regions.find(r=>r.owner==='liang');if(!r)return empty('暂无可建设的州府。');return `<div class="page-tabs">${s.regions.filter(r=>r.owner==='liang').map(q=>btn(q.name,'constructionRegion',[q.id],q.id===r.id?'active':'')).join('')}</div><p class="muted-note">${r.name} · 本月${s.built?'已开工':'可开工'}。几级就建几个月，最高5级。</p><div class="panel-grid" style="margin-top:16px">${Object.entries(BUILDINGS).filter(([k])=>k!=='palace'||r.capital).map(([k,d])=>{const level=r.buildings[k],b=s.builds.find(b=>b.region===r.id&&b.key===k),factor=1+level*.7;return `<div class="panel-card build-card"><h3>${d.icon} ${d.name}</h3><div class="level">${'◆'.repeat(level)}${'◇'.repeat(5-level)} ${level}/5级</div><p>${d.desc}</p>${b?`<div class="progress"><i style="width:${(1-b.remaining/b.total)*100}%"></i></div><p>在建 ${b.level}级 · 余 ${b.remaining}个月</p>`:level>=5?'<p>已满级</p>':`<p>银 ${Math.ceil(d.money*factor)} · 木 ${Math.ceil(d.wood*factor)} · 铁 ${Math.ceil(d.iron*factor)}<br>工期 ${level+1}个月</p>`}<div class="inline-actions">${btn(b?'在建':level>=5?'已满级':'升级','run',['build',[r.id,k]],'primary',!!b||level>=5||s.built)}</div></div>`;}).join('')}</div>${s.builds.length?`<div class="profile-section"><h3>在建工程</h3>${s.builds.map(b=>`<p class="muted-note" style="margin-top:10px">${game.region(b.region).name} · ${BUILDINGS[b.key].name} ${b.level}级 · 剩余 ${b.remaining}/${b.total}个月</p>`).join('')}</div>`:''}`;}
 function arrearsPanel(){return s.flags.arrears?`<div class="notice treasury-alert"><b>军饷还欠 ${num(s.flags.arrears)}两</b><p>欠饷${s.flags.deficitMonths||1}个月，兵变风险约 ${Math.round(game.mutinyRisk())}%。余银会自动补饷，也可手动补发。</p>${btn('补发欠饷 · 银'+num(Math.min(s.money,s.flags.arrears)),'run',['repayArrears',[]],'primary',s.money<=0||s.phase!=='court')}</div>`:'';}
 function financeBody(){const b=game.budget();return arrearsPanel()+`<div class="stats-row">${stat('月收入',b.income,'两')}${stat('月支出',b.upkeep,'两')}${stat('月结余',b.net,'两')}${stat('总人口',b.population)}</div><p class="muted-note">军饷 ${b.army} · 官俸 ${b.civil} · 宫廷 ${b.palace} · 工程维护 ${b.projects}<br>产粮 ${b.grain} · 耗粮 ${b.food} · 月余粮 ${fmt(b.grainNet)}<br>月产木材 ${b.wood} · 铁矿 ${b.iron} · 战马 ${b.horses} · 贸易收入 ${b.trade}</p><div class="inline-actions">${[8,12,18].map(rate=>btn((rate===8?'低税':rate===12?'常税':'高税')+' '+rate+'%','run',['tax',[rate]],s.tax===rate?'primary':'')).join('')}</div><table class="list-table" style="margin-top:20px"><thead><tr><th>州府</th><th>人口</th><th>民心</th><th>粮产</th><th>税银</th><th>木材 · 铁矿 · 战马</th></tr></thead><tbody>${s.regions.filter(r=>r.owner==='liang').map(r=>{const o=game.output(r);return `<tr><td>${esc(r.name)}</td><td>${num(r.population)}</td><td>${r.loyalty}</td><td>${o.grain}</td><td>${o.money}</td><td>木材 ${o.wood} · 铁矿 ${o.iron} · 战马 ${o.horses}</td></tr>`;}).join('')}</tbody></table><div class="notice">现有资源：银 ${num(s.money)} / 粮 ${num(s.grain)} / 木材 ${s.wood} / 铁矿 ${s.iron} / 战马 ${s.horses}。缺粮减人口，欠饷减士气；民心低于18可能叛乱。</div>`;}
 function candidatesBody(type){const isExam=type==='exam',offer=isExam?s.exam:s.selection;if(!offer)return empty(isExam?'暂无考生。':'暂无人选，可派东厂寻人。');const waiting=s.people.filter(p=>p.location==='掖庭'&&!p.consort&&!p.dead).length,occupied=s.people.filter(p=>p.consort&&!p.dead).length,ids=offer.ids.filter(id=>!offer.chosen.includes(id)&&(!isExam?game.npc(id)?.location==='掖庭':true));const max=Number.isInteger(offer.maxChoices)?offer.maxChoices:Math.max(0,game.capacity()-occupied);const selectionNotice=`4年选秀一次。本届可选 ${max} 人，已选 ${offer.chosen.length} 人；后宫 ${occupied}/${game.capacity()}，掖庭候选 ${waiting}/15。每人银100、上朝行动1次。${offer.closed?'本届已结束。未选者留掖庭，可送回家。':'可选人入宫、送回家，或结束选秀。'}`;return `<div class="notice">${isExam?`每年科举一次，最多选3人。已选 ${offer.chosen.length}/3 人。<br>${game.examCost()===0?'首次录取免银两，之后每人60两。':'每人需60两。'}每次上朝行动-1。`:selectionNotice}</div>${!isExam?`<div class="inline-actions selection-controls">${btn('结束选秀（免费）','run',['selectionClose',[]],'primary',offer.closed||s.phase!=='court')}${offer.closed?tag('已结束 · 候选留掖庭'):''}</div>`:''}<div class="people-grid">${ids.map(id=>{const p=game.npc(id),n=p.selectionNote||{};return `<div class="panel-card ${isExam?'exam-card':'selection-card'}"><div style="display:flex;gap:12px;align-items:center"><div class="mini-portrait">${Art.portrait(p)}</div><div><h3>${esc(p.name)} · ${p.age}岁</h3><p>${esc(p.clan)}氏 · ${esc(p.personality)}<br>政 ${p.admin} / 文 ${p.literature} / 武 ${p.military} / 艺 ${p.art}</p></div></div>${!isExam?`<p>家世：${esc(n.rank||p.clan+'氏族人')}<br>外貌：${esc(n.appearance||'容貌清秀，举止端正')}<br>才艺：${esc(n.talent||p.hobby||'尚待了解')}<br>性情：${esc(n.virtue||p.personality||'尚待了解')}</p>`:''}<p>爱好 ${esc(p.hobby)} · 爱情 ${p.love}</p><div class="inline-actions">${btn('档案','profile',[id])}${btn(isExam?(game.examCost()===0?'录取 · 首次免费':'录取 · 银60'):'选入宫 · 银100','run',[isExam?'examChoose':'selectionChoose',[id]],'primary',offer.closed||s.phase!=='court')}${!isExam?btn('送回家 · 1行动','run',['selectionDismiss',[id]],'',s.phase!=='court'):''}</div></div>`;}).join('')||empty(isExam?'本届已选完。':waiting?'本届已选完，其他候选仍在掖庭。':'本届已选完。')}</div>`;}
 function pickerBody(){const mode=ui.modal.mode,target=ui.modal.target;if(mode==='gift-person')return `<p class="muted-note">将宝物赏给${esc(game.npc(target)?.name)}，每次下朝行动-1。</p><div class="panel-grid" style="margin-top:15px">${s.treasures.map(t=>`<div class="panel-card"><h3>${esc(t.name)}</h3><p>喜好：${esc(t.hobby)}</p><div class="inline-actions">${btn('赏赐','run',['gift',[target,t.id]],'primary')}</div></div>`).join('')||empty('宝库为空。')}</div>`;
   let pool=game.alive().filter(p=>p.age>=18&&p.id!==s.player.id);if(['office','governor','agency-appoint'].includes(mode))pool=pool.filter(p=>!p.consort);if(mode==='office'){const appointed=new Set(Object.values(s.offices));pool=pool.filter(p=>appointed.has(p.id)||p.office==='新科进士');}if(mode==='gift')pool=game.alive();const group=ui.modal.group||'全部';if(group!=='全部')pool=pool.filter(p=>game.relationGroup(p)===group);

 function haremBody(){const people=s.people.filter(p=>p.consort&&!p.dead),waiting=s.people.filter(p=>p.location==='掖庭'&&!p.consort&&!p.dead),rooms=['坤宁宫',...Array.from({length:(game.capacity()-1)/2},(_,i)=>'偏殿'+(i+1))];return `<p class="muted-note">皇后独住，其余每殿2人。后宫每升1级，多住2人。当前容量 ${people.length}/${game.capacity()}；掖庭候选 ${waiting.length}/15。</p><div class="panel-grid" style="margin-top:16px">${rooms.map(room=>`<div class="panel-card"><h3>${room}</h3><p>${room==='坤宁宫'?'皇后独居 · 1人':'偏殿 · 最多2人'}</p>${people.filter(p=>p.room===room).map(p=>`<div style="margin-top:12px">${btn(esc(p.name)+' →','profile',[p.id],'link-btn')}<p>好感 ${p.friend} · 爱情 ${p.love}</p></div>`).join('')||'<p>尚无入住</p>'}</div>`).join('')}</div><div class="profile-section"><h3>掖庭 · 候选住处</h3><p class="muted-note">未册封者住在掖庭，最多15人。上朝时可送回家。</p><div class="people-grid">${waiting.map(p=>`<div class="person-row"><button class="mini-portrait" aria-label="查看${esc(p.name)}档案" data-do="profile" data-args="${esc(JSON.stringify([p.id]))}">${Art.portrait(p)}</button><div class="person-info"><h3>${esc(p.name)} · ${p.age}岁</h3><p>${esc(p.selectionNote?.rank||p.clan+'氏')}<br>好感 ${p.friend} · 爱情 ${p.love}</p></div>${s.phase==='court'?btn('送回家 · 1行动','run',['selectionDismiss',[p.id]],''):'<span class="muted-note">请上朝后处理</span>'}</div>`).join('')||empty('暂无候选。')}</div><div class="inline-actions">${btn('选秀','modal',['selection'])}${btn('修建后宫','modal',['construction','r0'])}${btn('全部关系','modal',['relations'])}</div><div class="notice">侍寝：成年、非近亲、未婚即可直接选择；每次消耗1次下朝行动，男女均可有子。孕期9个月。</div>`;}

 function renderModal(){const m=ui.modal;if(!m)return;let title='',sub='',body='',foot;switch(m.type){

  case'caseReports':title='刑部调查结果';sub='本月调查结果';body=game.caseReports().map(r=>`<div class="profile-section"><h3>${esc(r.title)}</h3><p class="story-scene">${esc(r.text)}</p></div>`).join('')||empty('本回暂无调查结果。');body+=btn('处理案件','modal',['cases'],'primary btn');foot='查看不消耗行动力。结果已记入案件与记事。';break;
